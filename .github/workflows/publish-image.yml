name: publish strut image

# Builds the repo-root Dockerfile (the standalone strut server: engine, web UI
# and the tools workflows exec) for amd64 and arm64, and pushes it to
# ghcr.io/stakwork/strut when anything that goes into the image changes on
# main. arm64 is for home servers (Apple Silicon, Raspberry Pi 4/5). Tags are
# the moving `latest` and the short commit sha, which is what a deploy pins;
# package.json's version is not bumped per change, so it is not a tag.
#
# Each platform's build is also its smoke test: the Dockerfile opens a Ladybug
# graph with `RUN --network=none` and fails unless the vector + fts extensions
# it carries load (scripts/image-ladybug-extensions.mjs check), so neither
# half is pushed if its graph would need the extension host.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "kit/**"
      - "scripts/check-app-build.mjs"
      - "scripts/image-ladybug-extensions.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    # A manual dispatch from another branch would otherwise overwrite `latest`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom off: a plain two-platform index with no attestation
      # manifests, like the browser image and stakgraph's images. The arm64
      # half builds under QEMU, hence the longer timeout; the gha cache keeps
      # the apt/pip/yarn layers between pushes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stakwork/strut:${{ steps.sha.outputs.short }}
            ghcr.io/stakwork/strut:latest
          # What `strut move check` compares; the desktop package stamps the same.
          build-args: |
            STRUT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
