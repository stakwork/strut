name: publish browser image

# Builds images/browser (a Playwright server, see its Dockerfile) and pushes it
# to ghcr.io/stakwork/strut-browser when that directory changes on main. The
# tag is the Playwright version the Dockerfile pins (`1.63.0`, plus the moving
# `1.63` and `latest`), because whoever runs the image pins it to the
# `playwright-core` of the host that connects to it.

on:
  push:
    branches: [main]
    paths:
      - "images/browser/**"
      - ".github/workflows/publish-browser.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-browser
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Playwright version
        id: version
        run: |
          full=$(sed -n 's/^ARG PLAYWRIGHT_VERSION=//p' images/browser/Dockerfile | head -1)
          if [[ ! "$full" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "no PLAYWRIGHT_VERSION in images/browser/Dockerfile (got '$full')"
            exit 1
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=${full%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom off: a plain two-platform index with no attestation
      # manifests, like the mcp and gateway images stakgraph publishes.
      - uses: docker/build-push-action@v6
        with:
          context: images/browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stakwork/strut-browser:${{ steps.version.outputs.full }}
            ghcr.io/stakwork/strut-browser:${{ steps.version.outputs.minor }}
            ghcr.io/stakwork/strut-browser:latest
          provenance: false
          sbom: false
