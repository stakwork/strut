name: tests

# Runs the unit suite (`npm test`) on every pull request, and on every push to
# main so that main saves the yarn cache: GitHub scopes a cache to the ref that
# saved it, and a PR can read its own ref's caches and its base branch's, never
# a sibling PR's. Without a main run every PR's first job re-downloads the
# whole tree from the registry (~1.8 GB unpacked, every platform's optional
# binaries — yarn v1 fetches them all), and a slow registry edge turns a 15 s
# install into minutes (2026-10-13: 3.5 and 7.4 min). Install mirrors the
# Dockerfile: yarn.lock is the lockfile, and --ignore-scripts skips the root
# `prepare` (tsc + web install + web build) — tsx runs the .ts tests directly,
# and the web tests only import root sources. The kit's tests (kit/src, in the
# same glob) import React and the kit's dependency set, so the kit gets its own
# install from kit/yarn.lock — a second lockfile the cache key covers.
#
# The `graph` job runs the live graph suites (`npm run test:graph`) against a
# throwaway Neo4j, the default server's backend: the unit job only exercises a
# LadybugDB file, so a Neo4j-only regression (strut#448: editing a jarvis-typed
# Concept; a type's own created_at in graph/find) was green there. It is
# neo4j:5.19.0, what the swarms run — a newer 5.x accepts Cypher 5.19 refuses.
# It runs the Neo4j half only (`STRUT_TEST_LADYBUG=off`): every graph file's
# Ladybug half is the unit job's already, and run twice it was 8 of the job's
# 21 minutes. The rest is split over three jobs (`STRUT_TEST_SHARD`, node's
# --test-shard: files round-robin), each with a Neo4j of its own since every
# suite wipes it: ~5 min each where one job took 22. Same install. The STT
# suite needs a model download and stays opt-in (see AGENTS.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            kit/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install the kit
        run: yarn --cwd kit install --frozen-lockfile --ignore-scripts

      - name: Test
        run: npm test

  graph:
    name: graph (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      neo4j:
        image: neo4j:5.19.0
        env:
          NEO4J_AUTH: neo4j/struttest
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p struttest 'RETURN 1'"
          --health-interval 5s
          --health-timeout 15s
          --health-retries 30
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            kit/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install the kit
        run: yarn --cwd kit install --frozen-lockfile --ignore-scripts

      - name: Test against Neo4j
        run: npm run test:graph
        env:
          STRUT_TEST_NEO4J_URI: bolt://localhost:7687
          STRUT_TEST_NEO4J_PASSWORD: struttest
          STRUT_TEST_LADYBUG: "off"
          STRUT_TEST_SHARD: ${{ matrix.shard }}/3
