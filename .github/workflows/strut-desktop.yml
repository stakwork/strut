name: strut desktop

# Stages strut for embedding in a native desktop app (plans/native-dictation-client.md §0)
# and publishes the tarballs on a `v*` tag. Node is not included; the
# tarball expects Node 20+ on the machine. darwin-arm64 is smoke-tested on the
# runner; darwin-x64 is cross-staged (its addon can't load on an arm64 runner).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          yarn install --frozen-lockfile
          npm --prefix web install

      - name: Package darwin-arm64 (smoke-tested)
        run: npm run package:desktop -- --smoke --tar --out dist-desktop

      - name: Package darwin-x64 (cross-staged)
        run: npm run package:desktop -- --platform darwin-x64 --skip-build --tar --out dist-desktop-x64

      - uses: actions/upload-artifact@v4
        with:
          name: strut-desktop
          path: |
            dist-desktop/strut-darwin-arm64.tar.gz
            dist-desktop-x64/strut-darwin-x64.tar.gz

      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist-desktop/strut-darwin-arm64.tar.gz
            dist-desktop-x64/strut-darwin-x64.tar.gz
