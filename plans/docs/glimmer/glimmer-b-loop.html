<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glimmer — the continual learning loop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; }
      #app { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/system-canvas-standalone@latest/dist/system-canvas.min.js"></script>
    <script>
      // Version B — LOOP. One cycle: the graph builds the agent, the agent does
      // the work, reflection and dreaming write back, the next agent is better.
      const PINK = '#f472b6', VIOLET = '#a78bfa', GREEN = '#2fa57c', AMBER = '#fbbf24', SLATE = '#64748b', ORANGE = '#fb923c';
      const tint = (hex, a) => { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
      const cd = (c) => c.node.customData || {};

      const categories = {
        glimmer: {
          defaultWidth: 360, defaultHeight: 120, cornerRadius: 18, fill: tint(PINK, 0.12), stroke: PINK,
          slots: {
            header: { kind: 'text', value: 'GLIMMER AGENT' },
            body: { kind: 'text', value: 'Glimmer', fontSize: 30, fontWeight: 700, fill: { from: PINK, to: VIOLET } },
            footer: { kind: 'text', value: 'assembled from the graph at run time' },
          },
        },
        store: {
          defaultWidth: 170, defaultHeight: 60, cornerRadius: 12, fill: 'rgba(15,23,42,0.75)', stroke: SLATE,
          slots: { topLeft: { kind: 'icon', name: (c) => cd(c).icon || 'code', color: (c) => cd(c).color || SLATE, size: 15 } },
        },
        stage: {
          defaultWidth: 270, defaultHeight: 110, cornerRadius: 14, fill: 'rgba(15,23,42,0.7)', stroke: SLATE,
          slots: { header: { kind: 'text', value: (c) => cd(c).kicker || '' } },
        },
      };

      const stores = [
        ['code', 'Code', 'code', '#38bdf8'], ['concepts', 'Concepts', 'network', '#34d399'], ['prompts', 'Prompts', 'terminal', PINK],
        ['tools', 'Tools', 'cog', AMBER], ['workflows', 'Workflows', 'zap', '#a3e635'], ['logs', 'Execution logs', 'database', ORANGE],
      ];
      const storeNodes = stores.map(([id, text, icon, color], i) => ({
        id, type: 'text', text, category: 'store', color, customData: { icon, color },
        x: -340 + (i % 3) * 240, y: -40 + Math.floor(i / 3) * 90,
      }));

      const nodes = [
        { id: 'graph', type: 'group', label: 'GLIMMER GRAPH — code, context, skills, prompts, tools, workflows, logs, best practices', x: -400, y: -110, width: 800, height: 270 },
        ...storeNodes,
        { id: 'glimmer', type: 'text', text: '', x: -180, y: -420, category: 'glimmer' },
        { id: 'run', type: 'text', text: 'PRs · legal tasks · GAIA\nhow the work gets done', x: 620, y: -32, category: 'stage', color: GREEN, customData: { kicker: 'RUN' } },
        { id: 'reflect', type: 'text', text: 'traces · annotated edges · new concepts\nbetter prompts, tools and workflow steps', x: -180, y: 300, width: 360, category: 'stage', color: VIOLET, customData: { kicker: 'REFLECT + DREAM' } },
        { id: 'world', type: 'text', text: 'PR reviews · meetings · chats\nproduction logs · workflows', x: -890, y: -32, category: 'stage', color: SLATE, customData: { kicker: 'INPUTS' } },
      ];

      const edges = [
        { id: 'e1', fromNode: 'graph', toNode: 'glimmer', label: 'search · pagerank · embeddings · graph walk', strokeWidth: 6, color: VIOLET, fromSide: 'top', toSide: 'bottom' },
        { id: 'e2', fromNode: 'glimmer', toNode: 'run', label: 'acts', strokeWidth: 5, color: GREEN, fromSide: 'right', toSide: 'top' },
        { id: 'e3', fromNode: 'run', toNode: 'reflect', label: 'reflects', strokeWidth: 5, color: ORANGE, fromSide: 'bottom', toSide: 'right' },
        { id: 'e4', fromNode: 'reflect', toNode: 'graph', label: 'writes back', strokeWidth: 6, color: PINK, fromSide: 'top', toSide: 'bottom' },
        { id: 'e5', fromNode: 'world', toNode: 'graph', label: 'dreams', strokeWidth: 4, color: SLATE, fromSide: 'right', toSide: 'left' },
        { id: 'r1', fromNode: 'concepts', toNode: 'code', label: '', strokeWidth: 4, color: GREEN, toEnd: 'none' },
        { id: 'r2', fromNode: 'prompts', toNode: 'concepts', label: '', strokeWidth: 3, color: GREEN, toEnd: 'none' },
        { id: 'r3', fromNode: 'workflows', toNode: 'tools', label: '', strokeWidth: 1.5, color: '#475569', toEnd: 'none' },
        { id: 'r4', fromNode: 'logs', toNode: 'workflows', label: '', strokeWidth: 2, color: '#fb7185', toEnd: 'none' },
      ];

      const base = SystemCanvas.themes.midnight;
      const theme = { ...base, categories: { ...base.categories, ...categories }, edge: { ...base.edge, labelFontSize: 11, labelColor: '#94a3b8' }, group: { ...base.group, strokeDasharray: 'none', stroke: '#334155', fill: 'rgba(30,41,59,0.22)', labelFontSize: 12 } };
      SystemCanvas.render(document.getElementById('app'), { canvas: { nodes, edges }, theme, edgeStyle: 'bezier', rootLabel: 'Glimmer' });
    </script>
  </body>
</html>
