<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glimmer — the harness is built from the graph</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; }
      #app { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/system-canvas-standalone@latest/dist/system-canvas.min.js"></script>
    <script>
      // Version C — STACK. Top-down: the world feeds the graph, the graph
      // assembles the harness, the harness is Glimmer, Glimmer ships.
      const PINK = '#f472b6', VIOLET = '#a78bfa', GREEN = '#2fa57c', AMBER = '#fbbf24', SLATE = '#64748b', ORANGE = '#fb923c';
      const tint = (hex, a) => { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
      const cd = (c) => c.node.customData || {};

      const categories = {
        glimmer: {
          defaultWidth: 420, defaultHeight: 120, cornerRadius: 18, fill: tint(PINK, 0.12), stroke: PINK,
          slots: {
            header: { kind: 'text', value: 'GLIMMER AGENT · gRLM harness' },
            body: { kind: 'text', value: 'Glimmer', fontSize: 30, fontWeight: 700, fill: { from: PINK, to: VIOLET } },
            footer: { kind: 'text', value: 'one generalist agent, built fresh for every task' },
          },
        },
        harness: {
          defaultWidth: 200, defaultHeight: 70, cornerRadius: 12, fill: tint(VIOLET, 0.14), stroke: VIOLET,
          slots: { header: { kind: 'text', value: 'FETCHED AT RUN TIME' } },
        },
        store: {
          defaultWidth: 160, defaultHeight: 60, cornerRadius: 12, fill: 'rgba(15,23,42,0.75)', stroke: SLATE,
          slots: { topLeft: { kind: 'icon', name: (c) => cd(c).icon || 'code', color: (c) => cd(c).color || SLATE, size: 15 } },
        },
        world: {
          defaultWidth: 200, defaultHeight: 60, cornerRadius: 10, fill: 'rgba(15,23,42,0.55)', stroke: '#475569',
        },
        out: {
          defaultWidth: 300, defaultHeight: 96, cornerRadius: 12, fill: tint(GREEN, 0.12), stroke: GREEN,
          slots: { header: { kind: 'text', value: 'SHIPS' } },
        },
      };

      const stores = [
        ['workflows', 'Workflows', 'zap', '#a3e635'], ['logs', 'Execution logs', 'database', ORANGE],
        ['prompts', 'Prompts', 'terminal', PINK], ['practices', 'Best practices', 'shield', '#c084fc'],
        ['tools', 'Tools', 'cog', AMBER], ['code', 'Code', 'code', '#38bdf8'], ['concepts', 'Concepts', 'network', '#34d399'],
      ];
      const storeNodes = stores.map(([id, text, icon, color], i) => ({
        id, type: 'text', text, category: 'store', color, customData: { icon, color },
        x: -640 + i * 185, y: 40,
      }));
      const worlds = ['PR reviews', 'Meeting transcripts', 'Chat records', 'Production logs', 'Workflow outputs'];
      const worldNodes = worlds.map((t, i) => ({ id: `w${i}`, type: 'text', text: t, category: 'world', x: -560 + i * 230, y: 330 }));

      const nodes = [
        { id: 'glimmer', type: 'text', text: '', x: -30, y: -500, category: 'glimmer' },
        { id: 'h-prompt', type: 'text', text: 'System prompt', x: -197, y: -280, category: 'harness' },
        { id: 'h-tools', type: 'text', text: 'Tools', x: 80, y: -280, category: 'harness' },
        { id: 'h-context', type: 'text', text: 'Context', x: 357, y: -280, category: 'harness' },
        { id: 'graph', type: 'group', label: 'GLIMMER GRAPH — everything, legible to every agent. The intelligence is in the edges: importance, staleness, centrality, contradictions.', x: -680, y: -30, width: 1360, height: 170 },
        ...storeNodes,
        ...worldNodes,
        { id: 'output', type: 'text', text: 'dozens of PRs a day · Harvey LAB\nGAIA · your own stack', x: 640, y: -512, category: 'out' },
      ];

      const edges = [
        { id: 'a1', fromNode: 'h-prompt', toNode: 'glimmer', strokeWidth: 4, color: VIOLET, fromSide: 'top', toSide: 'bottom' },
        { id: 'a2', fromNode: 'h-tools', toNode: 'glimmer', strokeWidth: 4, color: VIOLET, fromSide: 'top', toSide: 'bottom' },
        { id: 'a3', fromNode: 'h-context', toNode: 'glimmer', strokeWidth: 4, color: VIOLET, fromSide: 'top', toSide: 'bottom' },
        { id: 'g1', fromNode: 'prompts', toNode: 'h-prompt', strokeWidth: 3.5, color: PINK, fromSide: 'top', toSide: 'bottom' },
        { id: 'g1b', fromNode: 'practices', toNode: 'h-prompt', label: 'concepts as instructions', strokeWidth: 3, color: '#c084fc', fromSide: 'top', toSide: 'bottom' },
        { id: 'g2', fromNode: 'tools', toNode: 'h-tools', label: 'tools that scored well before', strokeWidth: 3.5, color: AMBER, fromSide: 'top', toSide: 'bottom' },
        { id: 'g3', fromNode: 'code', toNode: 'h-context', label: 'embeddings', strokeWidth: 3.5, color: '#38bdf8', fromSide: 'top', toSide: 'bottom' },
        { id: 'g3b', fromNode: 'concepts', toNode: 'h-context', label: 'graph walk · pagerank', strokeWidth: 3.5, color: '#34d399', fromSide: 'top', toSide: 'bottom' },
        ...worlds.map((_, i) => ({ id: `d${i}`, fromNode: `w${i}`, toNode: 'graph', strokeWidth: 2, color: SLATE, fromSide: 'top', toSide: 'bottom', label: i === 2 ? 'dreams' : undefined })),
        { id: 'ship', fromNode: 'glimmer', toNode: 'output', label: 'does the work', strokeWidth: 4, color: GREEN, fromSide: 'right', toSide: 'left' },
        { id: 'trace', fromNode: 'output', toNode: 'graph', label: 'every run becomes a trace', strokeWidth: 2.5, color: ORANGE, fromSide: 'bottom', toSide: 'right' },
      ];

      const base = SystemCanvas.themes.midnight;
      const theme = { ...base, categories: { ...base.categories, ...categories }, group: { ...base.group, strokeDasharray: 'none', stroke: '#334155', fill: 'rgba(30,41,59,0.22)', labelFontSize: 12 } };
      SystemCanvas.render(document.getElementById('app'), { canvas: { nodes, edges }, theme, edgeStyle: 'bezier', rootLabel: 'Glimmer' });
    </script>
  </body>
</html>
