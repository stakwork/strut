<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glimmer — the graph is the harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; }
      #app { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/system-canvas-standalone@latest/dist/system-canvas.min.js"></script>
    <script>
      // Version A — HUB. Glimmer on top, the graph in the center as a ring of
      // everything it stores, the world feeding it from below.
      const PINK = '#f472b6', VIOLET = '#a78bfa', GREEN = '#2fa57c', AMBER = '#fbbf24', SLATE = '#64748b';
      const tint = (hex, a) => { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
      const cd = (c) => c.node.customData || {};

      const categories = {
        glimmer: {
          defaultWidth: 360, defaultHeight: 120, cornerRadius: 18, fill: tint(PINK, 0.12), stroke: PINK,
          slots: {
            header: { kind: 'text', value: 'GLIMMER AGENT' },
            body: { kind: 'text', value: 'Glimmer', fontSize: 30, fontWeight: 700, fill: { from: PINK, to: VIOLET } },
            footer: { kind: 'text', value: 'prompt · tools · context — all fetched from the graph at run time' },
          },
        },
        store: {
          defaultWidth: 190, defaultHeight: 66, cornerRadius: 12, fill: 'rgba(15,23,42,0.75)', stroke: SLATE,
          slots: { topLeft: { kind: 'icon', name: (c) => cd(c).icon || 'code', color: (c) => cd(c).color || SLATE, size: 16 } },
        },
        core: {
          defaultWidth: 250, defaultHeight: 96, cornerRadius: 48, fill: tint(VIOLET, 0.14), stroke: VIOLET,
          slots: { header: { kind: 'text', value: 'THE INTELLIGENCE LIVES IN THE EDGES' } },
        },
        world: {
          defaultWidth: 560, defaultHeight: 72, cornerRadius: 12, fill: 'rgba(15,23,42,0.6)', stroke: SLATE,
          slots: { header: { kind: 'text', value: 'EVERYTHING THAT HAPPENS' } },
        },
        out: {
          defaultWidth: 250, defaultHeight: 96, cornerRadius: 12, fill: tint(GREEN, 0.12), stroke: GREEN,
          slots: { header: { kind: 'text', value: 'OUTPUT' } },
        },
      };

      // Ring of stores around the core
      const stores = [
        { id: 'code',      text: 'Code',               icon: 'code',     color: '#38bdf8' },
        { id: 'concepts',  text: 'Concepts',           icon: 'network',  color: '#34d399' },
        { id: 'prompts',   text: 'Prompts',            icon: 'terminal', color: '#f472b6' },
        { id: 'tools',     text: 'Tools',              icon: 'cog',      color: '#fbbf24' },
        { id: 'workflows', text: 'Workflows',          icon: 'zap',      color: '#a3e635' },
        { id: 'logs',      text: 'Execution logs',     icon: 'database', color: '#fb923c' },
        { id: 'practices', text: 'Best practices',     icon: 'shield',   color: '#c084fc' },
      ];
      const RX = 430, RY = 210, CX = 0, CY = 60;
      const ringNodes = stores.map((s, i) => {
        const a = -Math.PI / 2 + (i / stores.length) * Math.PI * 2;
        return { id: s.id, type: 'text', text: s.text, category: 'store', customData: s, color: s.color,
                 x: CX + RX * Math.cos(a) - 95, y: CY + RY * Math.sin(a) - 33 };
      });

      const nodes = [
        { id: 'graph', type: 'group', label: 'GLIMMER GRAPH — everything, legible to every agent', x: -600, y: -230, width: 1200, height: 590 },
        { id: 'glimmer', type: 'text', text: '', x: -180, y: -470, category: 'glimmer' },
        { id: 'core', type: 'text', text: 'importance · staleness\ncentrality · contradictions', x: -125, y: 12, category: 'core' },
        ...ringNodes,
        { id: 'world', type: 'text', text: 'PR reviews · meeting transcripts · chat records · production logs · workflow outputs', x: -340, y: 480, width: 680, category: 'world' },
        { id: 'output', type: 'text', text: 'dozens of PRs a day\nHarvey LAB · GAIA', x: 420, y: -458, category: 'out' },
      ];

      // Ring edges: the living values between nodes
      const ring = (a, b, label, width, color) => ({ id: `r-${a}-${b}`, fromNode: a, toNode: b, label, strokeWidth: width, color, toEnd: 'none' });
      const edges = [
        ring('concepts', 'code',      'importance 0.92', 6,   GREEN),
        ring('prompts',  'concepts',  'central',         4,   GREEN),
        ring('tools',    'workflows', 'importance 0.71', 3,   AMBER),
        ring('logs',     'practices', 'distilled',       3,   VIOLET),
        ring('practices','code',      'stale · 9mo',     1.5, '#475569'),
        ring('workflows','logs',      'contradicts',     2,   '#fb7185'),
        { id: 'loop', fromNode: 'graph', toNode: 'glimmer', label: 'builds its harness from the graph  ·  writes insights back as annotated edges', strokeWidth: 6, color: VIOLET, fromSide: 'top', toSide: 'bottom', fromEnd: 'arrow', toEnd: 'arrow' },
        { id: 'dream', fromNode: 'world', toNode: 'graph', label: 'dreams — background workflows turn events into nodes and edges', strokeWidth: 4, color: SLATE, fromSide: 'top', toSide: 'bottom' },
        { id: 'do', fromNode: 'glimmer', toNode: 'output', label: 'does the work', strokeWidth: 3, color: GREEN, fromSide: 'right', toSide: 'left' },
        { id: 'trace', fromNode: 'output', toNode: 'graph', label: 'every run becomes a trace', strokeWidth: 2, color: '#fb923c', fromSide: 'bottom', toSide: 'right' },
      ];

      const base = SystemCanvas.themes.midnight;
      const theme = { ...base, categories: { ...base.categories, ...categories }, group: { ...base.group, strokeDasharray: 'none', stroke: '#334155', fill: 'rgba(30,41,59,0.22)', labelFontSize: 12 } };
      SystemCanvas.render(document.getElementById('app'), { canvas: { nodes, edges }, theme, edgeStyle: 'bezier', rootLabel: 'Glimmer' });
    </script>
  </body>
</html>
