<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legal: the same tree, a different domain</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; }
      #app { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/system-canvas-standalone@latest/dist/system-canvas.min.js"></script>
    <script>
      // Law → practice area and drafting guidance → regulations, doctrine, matters, playbook entries, clauses. Same scores, same edges. 17 nodes.

      const HUE = {
        repository: '#f59e0b', concept: '#34d399', file: '#38bdf8', function: '#a78bfa',
        class: '#e879f9', endpoint: '#22d3ee', datamodel: '#fb7185',
        pr: '#94a3b8', commit: '#94a3b8', clue: '#fde68a', proposal: '#fdba74',
        chat: '#f472b6', run: '#fb923c', session: '#fbbf24', toolcall: '#cbd5e1', workflow: '#a3e635',
        law: '#f59e0b', regulation: '#60a5fa', regitem: '#93c5fd', doctrine: '#c084fc', jurisdiction: '#94a3b8',
        matter: '#fb7185', argument: '#fda4af', playbook: '#fde68a', clause: '#2dd4bf', clausetype: '#5eead4',
        definedterm: '#a3e635', excerpt: '#cbd5e1',
        note: '#64748b',
      };
      const FRESH = { fresh: '#2fa57c', aging: '#fbbf24', stale: '#475569' };
      const cd = (c) => c.node.customData || {};
      const tint = (hex, a) => { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
      const statusColor = (c) => FRESH[cd(c).freshness === 'growing' ? 'fresh' : (cd(c).freshness || 'aging')];
      const LABEL = { fresh: 'FRESH', aging: 'AGING', stale: 'STALE', growing: 'GROWING' };
      const cat = (key, label, w, h, extra = {}) => {
        const { slots = {}, ...rest } = extra;
        return { defaultWidth: w, defaultHeight: h, cornerRadius: 10, fill: tint(HUE[key], 0.15), stroke: HUE[key],
          slots: { header: { kind: 'text', value: label }, ...slots }, ...rest };
      };
      const categories = {
        repository: cat('repository', ':Repository', 240, 96, { cornerRadius: 14, slots: {
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        concept: cat('concept', ':Concept', 200, 84, { slots: {
          topRight: { kind: 'pill', value: (c) => LABEL[cd(c).freshness] || '', color: statusColor },
          topRightOuter: { kind: 'count', value: (c) => cd(c).clues, hideWhenEmpty: true },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        file: cat('file', ':File', 250, 72, { slots: {
          topRight: { kind: 'pill', value: (c) => cd(c).inDocs === undefined ? '' : (cd(c).inDocs ? 'IN DOCS' : 'OFF DOCS'), color: (c) => cd(c).inDocs ? HUE.concept : HUE.note },
          bottomEdge: { kind: 'progress', value: (c) => cd(c).importance || 0, color: statusColor, hideWhenZero: true } } }),
        function: cat('function', ':Function', 180, 64, { slots: { topRightOuter: { kind: 'count', value: (c) => cd(c).callers, hideWhenEmpty: true } } }),
        class: cat('class', ':Class', 180, 64),
        endpoint: cat('endpoint', ':Endpoint', 200, 64),
        datamodel: cat('datamodel', ':Datamodel', 180, 64, { cornerRadius: 32 }),
        pr: cat('pr', ':PullRequest', 230, 76, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).when || '', color: statusColor } } }),
        commit: cat('commit', ':Commit', 230, 76, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).when || '', color: statusColor } } }),
        clue: cat('clue', ':Clue', 200, 72),
        proposal: cat('proposal', ':ConceptProposal', 200, 72, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).status || '', color: HUE.proposal } } }),
        chat: cat('chat', ':StrutChat', 200, 72),
        run: cat('run', ':StrutRun', 200, 84, { slots: {
          topRight: { kind: 'pill', value: (c) => cd(c).status || '', color: (c) => cd(c).status === 'OK' ? FRESH.fresh : HUE.run },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        session: cat('session', ':StrutAgentSession', 210, 84, { slots: { footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        toolcall: cat('toolcall', ':StrutToolCall', 190, 64, { slots: { topRightOuter: { kind: 'count', value: (c) => cd(c).n, hideWhenEmpty: true } } }),
        workflow: cat('workflow', ':StrutWorkflow', 200, 72, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).version || '', color: HUE.workflow } } }),
        // Legal domain (Jarvis ontology, domain: Legal)
        law: cat('law', ':Legal · domain', 240, 96, { cornerRadius: 14, slots: { footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        regulation: cat('regulation', ':Regulation', 230, 100, { slots: {
          topRight: { kind: 'pill', value: (c) => LABEL[cd(c).freshness] || '', color: statusColor },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        regitem: cat('regitem', ':RegulatoryItem', 230, 100, { slots: { footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        doctrine: cat('doctrine', ':Doctrine', 230, 100, { slots: {
          topRight: { kind: 'pill', value: (c) => LABEL[cd(c).freshness] || '', color: statusColor },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        jurisdiction: cat('jurisdiction', ':Jurisdiction', 200, 64),
        matter: cat('matter', ':Matter', 230, 100, { slots: {
          topRight: { kind: 'pill', value: (c) => cd(c).status || '', color: HUE.matter },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        argument: cat('argument', ':LegalArgument', 250, 100, { slots: { footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        playbook: cat('playbook', ':PlaybookEntry', 250, 108, { slots: {
          topRight: { kind: 'pill', value: (c) => LABEL[cd(c).freshness] || '', color: statusColor },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        clause: cat('clause', ':ContractClause', 240, 84, { slots: {
          topRight: { kind: 'pill', value: (c) => cd(c).risk || '', color: (c) => ({ LOW: FRESH.fresh, MED: FRESH.aging, HIGH: HUE.matter })[cd(c).risk] || HUE.clause } } }),
        clausetype: cat('clausetype', ':ClauseType', 200, 64),
        definedterm: cat('definedterm', ':DefinedTerm', 220, 84, { slots: { footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        excerpt: cat('excerpt', ':Excerpt', 280, 100, { slots: { footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        note: { defaultWidth: 260, defaultHeight: 56, cornerRadius: 8, fill: 'rgba(15,23,42,0.55)', stroke: HUE.note },
      };
      const N = (id, category, text, x, y, customData, extra = {}) => ({ id, type: 'text', text, x, y, category, customData, ...extra });
      const E = (from, to, label, opts = {}) => ({ id: `${from}->${to}:${label || ''}`, fromNode: from, toNode: to, label, ...opts });
      const theme = { ...SystemCanvas.themes.midnight, categories: { ...SystemCanvas.themes.midnight.categories, ...categories } };

      const canvas = {
        theme: { base: 'midnight' },
        nodes: [
          N("law", "law", "Law", -120, -560, {"footer": "12 practice areas · 4 jurisdictions"}),
          N("anti", "concept", "Practice Area:\nAntitrust", -560, -380, {"freshness": "fresh", "clues": 31, "footer": "touched 3d ago"}, {"height": 100}),
          N("tips", "concept", "Document Drafting Tips", 320, -380, {"freshness": "aging", "clues": 12, "footer": "touched 5w ago"}, {"width": 250}),
          N("matter", "matter", "Acme / Globex\nmerger review", -900, -180, {"status": "OPEN", "footer": "filed 2026-08-02"}),
          N("clayton", "regulation", "Clayton Act § 7\nmergers · HSR", -600, -180, {"freshness": "fresh", "footer": "15 U.S.C. § 18"}),
          N("sherman", "regulation", "Sherman Act § 1\nrestraint of trade", -300, -180, {"freshness": "fresh", "footer": "15 U.S.C. § 1"}),
          N("ror", "doctrine", "Rule of reason", -300, 10, {"freshness": "aging", "footer": "Standard Oil (1911)"}),
          N("arg", "argument", "No substantial lessening\nof competition", -910, 200, {"footer": "HHI delta 140 · unconcentrated"}),
          N("hsr", "regitem", "HSR filing threshold\n$126.4M (2025)", -600, 200, {"footer": "revised annually"}),
          N("fed", "jurisdiction", "US Federal", -285, 200, {}),
          N("exhsr", "excerpt", "“…exceeding $126.4 million…”", -625, 390, {"footer": "90 Fed. Reg. 6106"}),
          N("pb", "playbook", "Non-compete: 12 mo firm\n18 mo fallback", 60, -180, {"freshness": "fresh", "footer": "position · fallback · walk-away"}),
          N("cl", "clause", "Antitrust cooperation\ncovenant", 380, -180, {"risk": "MED"}),
          N("dt", "definedterm", "“Antitrust Law”", 700, -180, {"footer": "define once, cite everywhere"}),
          N("ct", "clausetype", "regulatory efforts", 60, 10, {}),
          N("ex", "excerpt", "“…shall use reasonable best\nefforts to obtain clearance…”", 360, 10, {"footer": "Merger Agreement § 6.4"}),
          N("ex2", "excerpt", "“Antitrust Law means the\nSherman Act, the Clayton Act…”", 690, 10, {"footer": "Merger Agreement § 1.1"}),
        ],
        edges: [
          E("law", "anti", "importance 0.93", {"color": "#2fa57c", "strokeWidth": 7.5, "fromSide": "bottom", "toSide": "top"}),
          E("law", "tips", "importance 0.61", {"color": "#fbbf24", "strokeWidth": 5.5, "fromSide": "bottom", "toSide": "top"}),
          E("anti", "matter", "RELEVANT_TO 0.72", {"color": "#2fa57c", "strokeWidth": 6.2, "fromSide": "bottom", "toSide": "top"}),
          E("anti", "clayton", "RELEVANT_TO 0.88", {"color": "#2fa57c", "strokeWidth": 7.2, "fromSide": "bottom", "toSide": "top"}),
          E("anti", "sherman", "RELEVANT_TO 0.95", {"color": "#2fa57c", "strokeWidth": 7.7, "fromSide": "bottom", "toSide": "top"}),
          E("matter", "arg", "HAS_ARGUMENT", {"color": "#fb7185", "strokeWidth": 2.5, "fromSide": "bottom", "toSide": "top"}),
          E("clayton", "hsr", "ISSUED_UNDER", {"color": "#60a5fa", "strokeWidth": 2.5, "fromSide": "bottom", "toSide": "top"}),
          E("sherman", "ror", "INTERPRETED_BY", {"color": "#c084fc", "strokeWidth": 2.5, "fromSide": "bottom", "toSide": "top"}),
          E("ror", "fed", "APPLIES_IN", {"color": "#94a3b8", "strokeWidth": 2, "fromSide": "bottom", "toSide": "top"}),
          E("hsr", "exhsr", "EVIDENCED_BY", {"color": "#cbd5e1", "strokeWidth": 1.5, "fromSide": "bottom", "toSide": "top"}),
          E("arg", "ror", "GROUNDED_IN", {"fromSide": "top", "toSide": "left", "color": "#c084fc", "strokeWidth": 2}),
          E("tips", "pb", "RELEVANT_TO 0.84", {"color": "#2fa57c", "strokeWidth": 7.0, "fromSide": "bottom", "toSide": "top"}),
          E("tips", "cl", "RELEVANT_TO 0.66", {"color": "#fbbf24", "strokeWidth": 5.8, "fromSide": "bottom", "toSide": "top"}),
          E("tips", "dt", "RELEVANT_TO 0.41", {"color": "#fbbf24", "strokeWidth": 4.2, "fromSide": "bottom", "toSide": "top"}),
          E("pb", "sherman", "GOVERNED_BY", {"color": "#60a5fa", "strokeWidth": 2, "fromSide": "left", "toSide": "right"}),
          E("cl", "ct", "HAS_TYPE", {"color": "#2dd4bf", "strokeWidth": 2, "fromSide": "bottom", "toSide": "top"}),
          E("cl", "ex", "HAS_EXCERPT", {"color": "#cbd5e1", "strokeWidth": 1.5, "fromSide": "bottom", "toSide": "top"}),
          E("cl", "dt", "USES", {"color": "#2dd4bf", "strokeWidth": 1.5, "fromSide": "right", "toSide": "left"}),
          E("dt", "ex2", "DEFINED_IN", {"color": "#cbd5e1", "strokeWidth": 1.5, "fromSide": "bottom", "toSide": "top"}),
        ],
      };
      SystemCanvas.render(document.getElementById('app'), { canvas, theme, edgeStyle: 'bezier', rootLabel: "Legal: the same tree, a different domain" });
    </script>
  </body>
</html>
