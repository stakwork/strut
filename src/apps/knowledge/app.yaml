title: Knowledge
description: >-
  The organisation's knowledge (plans/knowledge-app.md): the ontology, every
  type's nodes (Concepts as the tree), one search over all of them, and the
  graph round whatever is picked, filtered by type; a Concept's history and
  the tree between two moments, from the history (plans/concept-history.md).
  Read-only. Strut ships it and seeds it on every server; it acts as its
  viewer.
icon: network
