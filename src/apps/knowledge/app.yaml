title: Knowledge
description: >-
  The organisation's knowledge (plans/knowledge-app.md): the ontology, every
  type's nodes (Concepts as the tree), one search over all of them, and the
  graph round whatever is picked, filtered by type; a Concept's history and
  the tree between two moments, from the history (plans/concept-history.md);
  a Concept's claims, and the changes to it the dream proposed where its
  tree is reviewed, which a person accepts or rejects here — the one write
  it makes; and, for an admin, what the dream learned, cycle by cycle: what
  people said, the claims, and what each cycle's run changed. Strut ships
  it and seeds it on every server; it acts as its viewer.
icon: network
