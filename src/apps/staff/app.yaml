title: Workers
description: >-
  The people who answer this server's workflows (plans/human-steps.md §9): the
  queue of tasks waiting for a person, the task types (who draws them, the
  answer's shape, its pay and its tests), the workers (inviting and letting
  them in, suspending them, what they answered and earned), every task with its
  answers, and the payouts (workers' withdrawals: the switch, the caps, the
  list). Strut ships it and seeds it on every server; it is an admin's:
  listed to an admin alone, and its steps answer an admin alone. Its Support
  tab is the staff's chat with workers over the treasury's Sphinx DMs
  (plans/people-and-hosts.md §5): Support's tables are this app's own SQLite
  (db/001-support.sql), the page reads and writes them with SQL, and the
  Sphinx daemon hands each DM to support/receive.
icon: users
theme: peel
admin: true
