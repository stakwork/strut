title: Jamie
description: >-
  Jamie, the person's assistant (plans/jamie-app.md §5): their conversations
  with this server's orchestrator — by day, searched, renamed, archived —
  each turn's reply, the jobs it started (live while they run, with their
  claims, captchas and pull requests, merged from here), the changes it
  proposes for a yes or no, and what it made — and Connect, which links the
  person's Peel (their Sphinx account) so a tribe's Jamie knows them and Peel
  opens this server's apps as them. Strut ships it and
  seeds it on every server; it acts as its viewer.
icon: message-circle
grants:
  workflows: [orchestrator, job, builder]
  steps:
    - conversation/list
    - conversation/get
    - conversation/update
    - conversation/fork
    - account/link
    - account/links
    - account/unlink
    - llm/models
    - graph/find
    - job/get
    - job/updates
    - job/verify
    - job/evidence
    - proposal/get
    - proposal/decide
    - sheets/get-values
    - github/pr-status
    - github/merge-pr
    - secret/add
