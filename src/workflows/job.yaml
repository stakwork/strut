name: job
# The job workflow (plans/jobs.md §5) — one turn of a job. A host launches it
# with `job` on the launch and a prompt: job/dir hands the agent the job's
# directory, `session` continues the job's thread, the agent writes its
# deliverables as FILES there and names them in its structured output, and
# the run's output carries them (resolved to links in the `run.end`
# callback). Without a job the same YAML is a one-shot in the run's
# artifact directory. Seeded at boot by createStrut (src/job-seed.ts);
# `params.tools` and `params.system` are the evolvable surface, and a host
# appends its own grants and prompt section through `createStrut({ job })`.
# Every step here is strut's own. The turn is done by strut's `agent` step,
# or — when the launch names an `agent` — by a local coding agent over ACP
# (acp/prompt: Claude Code, Codex, goose, any ACP command), in the job's
# directory or the folder the host passes as `cwd`.
input:
  prompt: { type: string, description: "What to do this turn" }
  workspace: { type: string, required: false, description: "The workspace this strut belongs to, by its slug. Another workspace is a peer, @<slug>" }
  kind: { type: string, required: false, description: "The kind of work, by the name of its page under the Job Concept (\"Code Change\"): the turn opens with that page. job/continue carries the last turn's" }
  session: { type: string, required: false, description: "The agent's thread (a session id). Defaults to the job id — one thread across every turn of the job. Pass one to work on the job's files with a different thread (a fresh one, or a second beside the first)" }
  repos: { type: json, required: false, description: "Repository URLs to check out into the job's directory, one subdirectory each, kept there turn to turn (a private one needs the launching person's GITHUB_TOKEN here)" }
  agent: { type: string, required: false, description: "A local coding agent to do the turn over ACP instead of strut's own: claude, codex, goose, gemini, opencode, or an ACP command line. It uses its own login, model and tools" }
  mode: { type: string, required: false, description: "With `agent`: plan (look only), edit (edit files; commands only inside the agent's sandbox) or auto (anything). Default edit" }
  model: { type: string, required: false, description: "With `agent`: one of the models that agent offers. Its own default otherwise" }
  cwd: { type: string, required: false, description: "An absolute folder to work in instead of the job's directory — a host's own checkout or worktree" }
steps:
  - id: dir
    type: job/dir
  # One checkout per repository, INTO the job's directory (`workdir: "{{ $job }}"`;
  # a fresh copy in the run's own directory without a job). `|| 0` — foreach
  # takes a count — is "no repositories".
  - id: checkouts
    type: foreach
    config:
      items: "{{ input.repos || 0 }}"
      body:
        id: checkout
        type: git/checkout
        config:
          repo: "{{ $current }}"
          workdir: "{{ $job }}"
  # The workspace's page on the kinds of work done here (the `Job` Concept
  # and the pages under it), rendered for the agent's system prompt as the
  # builder's prompt renders `Workflow Builder`. Read every turn; the thread
  # keeps its first turn's system prompt, so a job keeps the list it began
  # with. Empty without a graph or the page.
  - id: concepts
    type: context/concept
    config:
      name: "{{ params.concept }}"
  # The KIND of work this job is (`input.kind`: a page under the `Job`
  # Concept, the name the orchestrator routed the request by): its page and
  # the pages under it, at the head of THIS turn's prompt, so the agent
  # starts from the kind's convention — when to plan, where to build —
  # rather than having to open it. In the prompt, not the system prompt:
  # the thread keeps its first turn's, and a job's kind can change
  # (job/continue). Nothing without a kind, a graph or the page.
  - id: kindPage
    type: context/concept
    config:
      name: "{{ input.kind }}"
  # strut's own agent, unless the launch names a local one.
  - id: own
    type: if
    config:
      cond: "{{ !input.agent }}"
  - id: work
    type: agent
    depends: own
    when: true
    config:
      cwd: "{{ input.cwd || dir.path }}"
      session: "{{ input.session || $job }}"
      cacheTtl: 1h
      model: "{{ params.model }}"
      maxSteps: "{{ params.maxSteps }}"
      # strut's prompt (with the host's section), then the workspace's page.
      system: |-
        {{ params.system }}
        {{ concepts.text }}
      # The workspace line, then the job's id (what a claim's subject and the
      # builder's thread are named by), then the checkouts, then the kind's
      # page, then the message.
      prompt: "{{ input.workspace ? 'Workspace: @' + input.workspace + ', the one this strut belongs to. ' : '' }}{{ $job ? 'Your job id: ' + $job + '. ' : '' }}{{ checkouts.length ? 'Repositories checked out in your directory, one subdirectory each: ' + checkouts.map(c => c.repo).join(', ') + '. ' : '' }}{{ kindPage.text ? params.kindLead + kindPage.text + params.kindEnd : '' }}{{ input.prompt }}"
      agentTools: "{{ params.tools }}"
      approve: "{{ params.approve }}"
      schema:
        type: object
        additionalProperties: false
        required: [text, artifacts]
        properties:
          text: { type: string, description: "Your reply to the person, markdown. Short: the artifacts carry the substance." }
          artifacts:
            type: array
            description: "What you produced or revised THIS turn, for the person to look at, and any earlier job's deliverable you point them to. Files are paths relative to your working directory."
            items:
              type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: { type: string, description: "Stable across turns: the same id next turn means a newer version of the same thing (\"plan\", not \"plan-v3\")." }
                kind: { type: string, description: "As given when a workflow handed you the artifact (captcha, walkthrough, …; `app` with `app: <name>` for an app the builder published). Otherwise only when the file extension would mislead: markdown | html | image | video | audio | pdf | url | diff | pull_request | code | log | json" }
                title: { type: string }
                label: { type: string, description: "What it is to the reader: Plan, Page, Screenshot" }
                summary: { type: string, description: "One sentence about what is in it" }
                path: { type: string, description: "A file you wrote, relative to the working directory" }
                url: { type: string, description: "Instead of a file you wrote: an absolute link, or the url job/get gave an earlier job's deliverable" }
                content: { type: string, description: "Small inline content instead of a file (a diff, short JSON)" }
                app: { type: string, description: "An app in this workspace, by name, as the builder's reply gave it (with kind: app); its active version unless `version` names one" }
                version: { type: string, description: "With `app`: a version to pin (v3)" }
          ask:
            type: object
            description: "Only when you need a decision from the person before going on: the question, in prose. The answer comes as the next turn's prompt."
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string }
  - id: local
    type: acp/prompt
    depends: own
    when: false
    config:
      agent: "{{ input.agent }}"
      cwd: "{{ input.cwd || dir.path }}"
      session: "{{ input.session || $job }}"
      mode: "{{ input.mode || 'edit' }}"
      model: "{{ input.model }}"
      prompt: "{{ checkouts.length ? 'Repositories checked out in your directory, one subdirectory each: ' + checkouts.map(c => c.repo).join(', ') + '. ' : '' }}{{ input.prompt }}"
  # Whichever ran; the other was skipped and reads as undefined (a ternary
  # evaluates both sides, so `?.` and `||`).
  - id: result
    type: pack
    depends: [work, local]
    config:
      text: "{{ work?.object?.text || local?.text }}"
      artifacts: "{{ work?.object?.artifacts || local?.artifacts }}"
      ask: "{{ work?.object?.ask || local?.ask }}"
      cost: "{{ work?.cost || local?.cost }}"
      session: "{{ work?.session || local?.session }}"
params:
  model: claude-sonnet-5-5
  maxSteps: 500
  # The Concept whose page (and the kinds under it) closes the agent's
  # system prompt: strut seeds `Job` (src/concepts/Job.md), and each
  # deployment grows the tree under it.
  concept: Job
  # Around the page of the job's KIND (`input.kind`) at the head of a turn's
  # prompt. Text, so the framing evolves like `system`.
  kindLead: "\n\nThis job is the kind of work below, and its page is how that work is done here:\n\n"
  kindEnd: "\n\nThe message:\n\n"
  # THE evolvable surface: registry steps granted to the agent as tools
  # (agentTools), on top of its built-ins — repo_overview, fulltext_search,
  # bash, str_replace_based_edit_tool, web_search, web_fetch — which are
  # always on. Graph reads; the meta/* read + run tools: list/get a
  # workflow, run it (as a child run under this job, in this job's
  # directory — plans/jobs.md §4), read a run; strut/list-peers +
  # strut/run-workflow, the same
  # on a PEER (plans/federation.md §2.2; its files stay there); the job/*
  # reads (plans/job-index.md §5): earlier jobs by words, what one produced
  # and the thread it ran on, one of its files — a screenshot the agent then
  # SEES. The job's CLAIMS (plans/job-claims.md): one claim per change, its
  # check using what was delivered as its user would — browser/verify for
  # a page (browser/walkthrough for a flow, a frame per step), http/verify
  # for an endpoint, exec for a command — or a person's look when nothing
  # here runs it, never a check over the agent's own diff; and verify the
  # job before saying done. No app/* (2026-10-22): an APP is the builder's
  # — published in the workspace and handed over by name (`{ kind: "app",
  # app }`) — and a page over this job's own results is an HTML file in
  # its directory; the job-app runtime (plans/apps.md §6) is still served
  # for a directory with an app.yaml, but nothing here scaffolds or builds
  # one. A host appends its own (`createStrut({ job: { tools } })`): the
  # lab adds `pod/*`. Never the
  # authoring writes (meta/publish-workflow, meta/create-step, edit-step):
  # a workflow, or an app that lives in a workspace, is the `builder`
  # workflow's, which this agent runs through meta/run-workflow when such a
  # request reaches it (the `Job` page's own docs).
  tools:
    - graph/graph-search
    - graph/graph-get
    - graph/graph-neighbors
    - graph/get-ontology
    - meta/list-workflows
    - meta/get-workflow
    - meta/run-workflow
    - meta/get-run
    - meta/list-claims
    - meta/add-claim
    - meta/add-check
    - meta/edit-check
    - meta/verify-job
    - http/verify
    - browser/verify
    - browser/walkthrough
    - strut/list-peers
    - strut/run-workflow
    - job/list
    - job/get
    - job/read
  # Tools among the grants that need the PERSON's approval
  # (plans/proposals.md): a call records a proposal instead of running the
  # step, and strut runs it when they accept. None of strut's own; a host
  # appends its gated writes (`createStrut({ job: { approve } })`).
  approve: []
  system: |
    You are working on a JOB with a person, over many turns. Your working
    directory is the job's: everything you wrote in earlier turns is still
    there, and you remember writing it. Each turn you get one message. A
    repository named on the launch is checked out in your directory as a
    subdirectory, and stays there turn to turn: read it there.

    Your deliverables are FILES in the working directory — a page as
    index.html, notes as notes/<topic>.md. Revise a file
    in place rather than writing a new one; name files stably. When you are
    done, answer with `text` (short — what changed and why) and `artifacts`
    listing what you produced or revised THIS turn, each with the same `id`
    it had last time. Do not paste a deliverable's content into `text`.

    If you cannot go on without a decision from the person, stop and put
    the question in `ask`; their answer is the next turn's message.

    The kinds of work this workspace has a way to do are listed at the end
    of this prompt, from its knowledge graph: each a page saying which
    workflow does it, or how to work. A message that opens with a kind's
    page is that kind: follow the page. Otherwise, before you act on a
    message, match it against them. When the request is one of these
    kinds, open that page and follow it: prefer running the workflow it
    names over doing the work by hand, and say in `text` which page you
    followed. No list there (no graph, or no page yet): go on without it.

    Running a workflow: meta/list-workflows lists what this strut can do;
    meta/get-workflow shows a workflow's input and output;
    meta/run-workflow runs it as its own run under this job (same job id,
    same directory) and returns its output; meta/get-run explains a
    failure. Prefer running a workflow that does the work over doing it by
    hand, and say in `text` which one you ran. strut/run-workflow runs one
    on a PEER — another strut, named by its slug (`@<slug>` in a message) —
    and returns its output; its files stay there. strut/list-peers says
    which peers there are and what each holds, and also names THIS
    workspace (`self`) and its repositories — code there is here. When no workflow fits,
    the work is yours — a plan, a page, notes — as files in your directory.

    Seeing what a page shows is a workflow too. You have no browser to look
    around with: to look at a site or a running app, run browser-explore —
    meta/run-workflow { name: "browser-explore", input: { goal, url } } —
    with a goal that stands alone, since it sees nothing of this
    conversation. It drives strut's own browser, looks for itself and
    answers { answer, evidence: [{ path, url }], pages }; on a job its
    screenshots land in your directory as shots/NNN.png, and each `url` is
    a link to report as an image artifact. Never install or launch a
    browser yourself (playwright, puppeteer, a headless chrome from bash):
    what it captures is a file you cannot see, and it runs beside strut,
    not in the browser set aside for this.

    A captcha is the person's to solve, never yours. browser-explore
    answering `captcha: { session }` means one stopped it and the page is
    kept: run browser-captcha { session }. Status `ask`: list its
    `artifact` as given and end the turn with `ask`. The answer comes back
    as a turn whose first line is `[captcha-answer] {…}`: run
    browser-captcha { session, answer: that JSON } at once — a challenge
    expires. `ask` again: the same. `solved`: run browser-explore { goal,
    url, session } at once, to go on where it stopped (the pass lasts about
    two minutes). `failed`: say so in `text`.

    Work done before is findable. When a message refers to earlier work —
    a plan, a page, a screenshot, "what we did last week" — look before
    starting over: job/list { q } finds jobs by words (a job's title, or
    what it delivered); job/get shows one — its runs, its files, its
    current deliverables (each with a `url`, and the `path` job/read
    takes), its threads; job/read opens one of its files (an image, you
    then see). Say in `text` which job you built on. An earlier job's
    deliverable you point the person to goes in `artifacts` like one of
    yours, by the `url` job/get gave it, with its id and title — never as a
    path in `text`, which they cannot open. To change one, copy it into
    your directory and list your copy by `path`: another job's directory
    is not yours to write.

    The work is done when it is VERIFIED, not when your last tool call
    returned. Once you understand what is asked, state it as a claim about
    the job — meta/add-claim with subject { kind: job, name: <your job id>
    }, one plain sentence about what the person gets ("the settings page
    shows the notification preferences", "GET /api/settings answers 200",
    "`acme export --csv` writes one row per order"). ONE claim for a
    change; several only when the ask has separate parts, one per part.
    Its check uses what you delivered the way its user would, where it
    runs:
    - a page: browser/verify (browser/walkthrough for a flow, a frame
      per step), on the running app the job holds
      (`{{ input.urls.pod }}/<path>`) or the page as its user opens it.
      It answers with a screenshot.
    - an endpoint: http/verify, the request and the answer expected, at
      `{{ input.urls.pod }}/<path>`.
    - a command, a script or a file you deliver: exec with `cwd: "{{
      input.dir }}"`, running it as its user would, exiting 0 when the
      claim holds.
    - what cannot run here (no running app holds it) or only a person can
      judge: an external check ({ description }) saying what the person
      should open and look at. They accept or reject it.
    Never a check that reads your own diff or code to confirm you wrote
    what you meant to: it only says your work agrees with itself.
    meta/list-claims shows the job's contract and what the person claimed
    from their side; hang your check on their claim rather than writing a
    second. When you believe the work is ready, call meta/verify-job: it
    runs the checks against the job as it is now and returns the ledger.
    Refuted means not done — fix the work (or a wrong check,
    meta/edit-check), verify again, and only then answer. A claim waiting
    on the person is theirs: say in `text` what to look at. A later turn
    makes the ledger `stale` until someone verifies again.
