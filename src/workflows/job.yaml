name: job
# The job workflow (plans/jobs.md §5) — one turn of a job. A host launches it
# with `job` on the launch and a prompt: job/dir hands the agent the job's
# directory, `session` continues the job's thread, the agent writes its
# deliverables as FILES there and names them in its structured output, and
# the run's output carries them (resolved to links in the `run.end`
# callback). Without a job the same YAML is a one-shot in the run's
# artifact directory. Seeded at boot by createStrut (src/job-seed.ts). The
# agent's INSTRUCTIONS are a Concept page, not this file: the `Job` page
# strut seeds (src/concepts/Job.md: how to work, the kinds of work, when the
# work is done), read into the system prompt with context/concept, so it
# changes as a page does and a claim on it judges a turn. This file keeps
# the mechanics: the directory, the checkouts, the reply's fields. That
# page, `params.tools` and `params.system` are the evolvable surface, and a
# host appends its own grants and prompt section through `createStrut({ job })`.
# Every step here is strut's own. The turn is done by strut's `agent` step,
# or — when the launch names an `agent` — by a local coding agent over ACP
# (acp/prompt: Claude Code, Codex, goose, any ACP command), in the job's
# directory or the folder the host passes as `cwd`.
input:
  prompt: { type: string, description: "What to do this turn" }
  workspace: { type: string, required: false, description: "This server's slug, the one this job runs on. Another server is a peer, @<slug>" }
  kind: { type: string, required: false, description: "The kind of work, by the name of its page under the Job Concept (\"Code Change\"): the turn opens with that page. job/continue carries the last turn's" }
  session: { type: string, required: false, description: "The agent's thread (a session id). Defaults to the job id — one thread across every turn of the job. Pass one to work on the job's files with a different thread (a fresh one, or a second beside the first)" }
  repos: { type: json, required: false, description: "Repository URLs to check out into the job's directory, one subdirectory each, kept there turn to turn (a private one needs the launching person's GITHUB_TOKEN here)" }
  agent: { type: string, required: false, description: "A local coding agent to do the turn over ACP instead of strut's own: claude, codex, goose, gemini, opencode, or an ACP command line. It uses its own login, model and tools" }
  mode: { type: string, required: false, description: "With `agent`: plan (look only), edit (edit files; commands only inside the agent's sandbox) or auto (anything). Default edit" }
  model: { type: string, required: false, description: "With `agent`: one of the models that agent offers. Its own default otherwise" }
  cwd: { type: string, required: false, description: "An absolute folder to work in instead of the job's directory — a host's own checkout or worktree" }
steps:
  - id: dir
    type: job/dir
  # One checkout per repository, INTO the job's directory (`workdir: "{{ $job }}"`;
  # a fresh copy in the run's own directory without a job). `|| 0` — foreach
  # takes a count — is "no repositories".
  - id: checkouts
    type: foreach
    config:
      items: "{{ input.repos || 0 }}"
      body:
        id: checkout
        type: git/checkout
        config:
          repo: "{{ $current }}"
          workdir: "{{ $job }}"
  # The agent's instructions and the kinds of work done here: the `Job`
  # Concept's page and the names of the pages under it, rendered for the
  # agent's system prompt as the builder's prompt renders `Workflow
  # Builder`. Read every turn; the thread keeps its first turn's system
  # prompt, so a job keeps the page and the list it began with. `max`: the
  # page is the agent's whole instructions, longer than a kind's. Where no
  # graph holds the page (a server with none), it is read from the file
  # strut ships, and so are the pages under it.
  - id: concepts
    type: context/concept
    config:
      name: "{{ params.concept }}"
      max: 10000
  # The KIND of work this job is (`input.kind`: a page under the `Job`
  # Concept, the name the orchestrator routed the request by): its page and
  # the pages under it, at the head of THIS turn's prompt, so the agent
  # starts from the kind's convention — when to plan, where to build —
  # rather than having to open it. In the prompt, not the system prompt:
  # the thread keeps its first turn's, and a job's kind can change
  # (job/continue). Nothing without a kind or its page.
  - id: kindPage
    type: context/concept
    config:
      name: "{{ input.kind }}"
  # What the person most likely means (plans/recent-work.md): the pages under
  # the `Recent Work` Concept, each listing the top few as the job's person,
  # at the head of the turn's prompt, and only when it changed since the
  # job's thread last saw it (the turn keeps its hash in `tags`).
  - id: recent
    type: context/recent
    config:
      name: "{{ params.recentConcept }}"
      session: "{{ input.session || $job }}"
  # strut's own agent, unless the launch names a local one.
  - id: own
    type: if
    config:
      cond: "{{ !input.agent }}"
  - id: work
    type: agent
    depends: own
    when: true
    config:
      cwd: "{{ input.cwd || dir.path }}"
      session: "{{ input.session || $job }}"
      cacheTtl: 1h
      model: "{{ params.model }}"
      maxSteps: "{{ params.maxSteps }}"
      # The mechanics (with the host's section), then the `Job` page: the
      # agent's instructions and the kinds of work.
      system: |-
        {{ params.system }}
        {{ concepts.text }}
      # The Recent Work section when it changed, the server line, then the
      # job's id (what a claim's subject and the builder's thread are named
      # by), then the checkouts, then the kind's page, then the message.
      prompt: "{{ recent.text }}{{ input.workspace ? 'This job runs on this server, @' + input.workspace + '. ' : '' }}{{ $job ? 'Your job id: ' + $job + '. ' : '' }}{{ checkouts.length ? 'Repositories checked out in your directory, one subdirectory each: ' + checkouts.map(c => c.repo).join(', ') + '. ' : '' }}{{ kindPage.text ? params.kindLead + kindPage.text + params.kindEnd : '' }}{{ input.prompt }}"
      # The message alone, what the graph keeps as this turn's text.
      message: "{{ input.prompt }}"
      # The Recent Work section's hash, what the next turn's `recent` reads.
      tags:
        recent: "{{ recent.hash }}"
      agentTools: "{{ params.tools }}"
      approve: "{{ params.approve }}"
      # The person's SSH key, signed with by an agent in strut's process:
      # bash gets SSH_AUTH_SOCK, never the key (ssh/keygen makes it).
      sshKeys: [SSH_KEY]
      schema:
        type: object
        additionalProperties: false
        required: [text, artifacts]
        properties:
          text: { type: string, description: "Your reply to the person, markdown. Short: the artifacts carry the substance." }
          artifacts:
            type: array
            description: "What you produced or revised THIS turn, for the person to look at, and any earlier job's deliverable you point them to. Files are paths relative to your working directory."
            items:
              type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: { type: string, description: "Stable across turns: the same id next turn means a newer version of the same thing (\"plan\", not \"plan-v3\")." }
                kind: { type: string, description: "As given when a workflow handed you the artifact (captcha, walkthrough, …; `app` with `app: <name>` for an app the builder published). Otherwise only when the file extension would mislead: markdown | html | image | video | audio | pdf | url | diff | pull_request | code | log | json | sheet | table | timeline | docx | redline" }
                title: { type: string }
                label: { type: string, description: "What it is to the reader: Plan, Page, Screenshot" }
                summary: { type: string, description: "One sentence about what is in it" }
                path: { type: string, description: "A file you wrote, relative to the working directory" }
                url: { type: string, description: "Instead of a file you wrote: an absolute link, or the url job/get gave an earlier job's deliverable" }
                content: { type: string, description: "Small inline content instead of a file (a diff, short JSON)" }
                render: { type: string, description: "A file a page can draw in its place, relative to the working directory: a .docx's HTML, a sheet's CSV" }
                from: { type: array, items: { type: string }, description: "The ref_ids of the graph nodes it was made from — the Concepts it follows, the excerpts it quotes — as the graph tools gave them" }
                app: { type: string, description: "An app on this server, by name, as the builder's reply gave it (with kind: app); its active version unless `version` names one" }
                version: { type: string, description: "With `app`: a version to pin (v3)" }
          ask:
            type: object
            description: "Only when you need a decision from the person before going on: the question, in prose. The answer comes as the next turn's prompt."
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string }
              secret: { type: string, description: "A secret this server lacks and the work needs, by NAME (letters, digits, _): the person types its value into a masked box under your question — never into a message — and your next message begins `[secret] NAME stored` (or `[secret] NAME is already set here`). One per turn; `message` says what it is for. Never ask for a value in `text` or `message`, and never say where to add one by hand." }
  - id: local
    type: acp/prompt
    depends: own
    when: false
    config:
      agent: "{{ input.agent }}"
      cwd: "{{ input.cwd || dir.path }}"
      session: "{{ input.session || $job }}"
      mode: "{{ input.mode || 'edit' }}"
      model: "{{ input.model }}"
      prompt: "{{ checkouts.length ? 'Repositories checked out in your directory, one subdirectory each: ' + checkouts.map(c => c.repo).join(', ') + '. ' : '' }}{{ input.prompt }}"
  # Whichever ran; the other was skipped and reads as undefined (a ternary
  # evaluates both sides, so `?.` and `||`).
  - id: result
    type: pack
    depends: [work, local]
    config:
      text: "{{ work?.object?.text || local?.text }}"
      artifacts: "{{ work?.object?.artifacts || local?.artifacts }}"
      ask: "{{ work?.object?.ask || local?.ask }}"
      cost: "{{ work?.cost || local?.cost }}"
      session: "{{ work?.session || local?.session }}"
params:
  model: claude-sonnet-5-5
  maxSteps: 500
  # The Concept whose page (the agent's instructions) and the kinds under
  # it close the agent's system prompt: strut seeds `Job`
  # (src/concepts/Job.md), and each deployment grows the tree under it.
  concept: Job
  # The root of what the person most likely means (the `recent` step): strut
  # seeds it (src/concepts/Recent Work.md); a package hangs pages under it.
  recentConcept: Recent Work
  # Around the page of the job's KIND (`input.kind`) at the head of a turn's
  # prompt. Text, so the framing evolves like `system`.
  kindLead: "\n\nThis job is the kind of work below, and its page is how that work is done here:\n\n"
  kindEnd: "\n\nThe message:\n\n"
  # THE evolvable surface: registry steps granted to the agent as tools
  # (agentTools), on top of its built-ins — repo_overview, fulltext_search,
  # bash, str_replace_based_edit_tool, web_search, web_fetch — which are
  # always on. Graph reads; the meta/* read + run tools: list/get a
  # workflow, run it (as a child run under this job, in this job's
  # directory — plans/jobs.md §4), read a run; strut/list-peers +
  # strut/run-workflow, the same
  # on a PEER (plans/federation.md §2.2; its files stay there); the job/*
  # reads (plans/job-index.md §5): earlier jobs by words, what one produced
  # and the thread it ran on, one of its files — a screenshot the agent then
  # SEES. The job's CLAIMS (plans/job-claims.md): one claim per change, its
  # check using what was delivered as its user would — browser/verify for
  # a page (browser/walkthrough for a flow, a frame per step), http/verify
  # for an endpoint, exec for a command — or a person's look when nothing
  # here runs it, never a check over the agent's own diff; and verify the
  # job before saying done. No app/* (2026-10-22): an APP is the builder's
  # — published on this server and handed over by name (`{ kind: "app",
  # app }`) — and a page over this job's own results is an HTML file in
  # its directory; the job-app runtime (plans/apps.md §6) is still served
  # for a directory with an app.yaml, but nothing here scaffolds or builds
  # one. A host appends its own (`createStrut({ job: { tools } })`): the
  # lab adds `pod/*`. An installed package appends what its strut.yaml's
  # `job:` names — its own steps, and strut's named one by one (`git/push`
  # for a change that ends as a pull request; src/job-seed.ts). Never the
  # authoring writes (meta/publish-workflow, meta/create-step, edit-step):
  # a workflow, or an app published on this server, is the `builder`
  # workflow's, which this agent runs through meta/run-workflow when such a
  # request reaches it (the `Job` page's own docs).
  tools:
    - graph/graph-search
    - graph/graph-get
    - graph/graph-neighbors
    - graph/get-ontology
    - meta/list-workflows
    - meta/get-workflow
    - meta/run-workflow
    - meta/get-run
    - meta/resume-run
    - meta/list-claims
    - meta/add-claim
    - meta/add-check
    - meta/edit-check
    - meta/verify-job
    - http/verify
    - browser/verify
    - browser/walkthrough
    - strut/list-peers
    - strut/run-workflow
    # What the turn is doing now, and its checklist, to whoever watches the
    # job (plans/live-feeds.md §4): the job card's live strip.
    - job/status
    - job/list
    - job/get
    - job/read
    # The package STORE's reads (plans/marketplace.md §7, §8): is there a
    # package for that — searched, a hit's page read (what it holds and
    # reaches), the Concept tree browsed. Reads: an install is proposed
    # with package/install, below.
    - package/search
    - package/get
    - package/concepts
    # A repository the job finds it needs mid-turn, checked out INTO the
    # job's directory (`workdir` = the job id, which the prompt names) as
    # `input.repos` are: with the person's token, which reaches git's child
    # env only — bash never holds it, so a clone there gets public repos
    # alone.
    - git/checkout
    # A package someone published (plans/marketplace.md §8), installed only
    # on the person's yes: the call is a proposal.
    - package/install
    # A package opened here as a git repo (plans/app-repos.md §3.3):
    # committed and pushed only on an admin's yes — the call is a proposal.
    - package/commit
    # Another strut server's public door (plans/paid-runs.md §10): what it
    # sells, and a run or a tool call there spending the credit this strut
    # already holds — no ask (decision 16). Buying credit is an admin's yes:
    # remote/buy-credit is a proposal, below.
    - remote/list
    - remote/run-workflow
    - remote/call
    - remote/buy-credit
    # A server someone lets the job into over SSH: the public half of the
    # person's key, made the first time — the private half stays in strut
    # and signs through the agent's `sshKeys`, so bash's ssh just works.
    - ssh/keygen
  # Tools among the grants that need the PERSON's approval
  # (plans/proposals.md): a call records a proposal instead of running the
  # step, and strut runs it when they accept. Strut's own: package/install
  # (someone's code into this strut), package/commit (this server's edits pushed
  # to a repo with a person's credential) and remote/buy-credit (this server's
  # sats to another strut). A host appends its gated writes
  # (`createStrut({ job: { approve } })`).
  approve:
    - package/install
    - package/commit
    - remote/buy-credit
  # The MECHANICS of a turn: the directory, the checkouts, the reply's
  # fields. How to work — the kinds of work, running a workflow, looking at
  # a site, earlier jobs, when the work is done — is the `Job` page, which
  # follows this in the system prompt (and the checklist a person watches is
  # strut's own note at the start of a turn, agent.ts `trackChecklist`).
  system: |
    You are working on a JOB with a person, over many turns. Your working
    directory is the job's: everything you wrote in earlier turns is still
    there, and you remember writing it. Each turn you get one message. A
    repository named on the launch is checked out in your directory as a
    subdirectory, and stays there turn to turn: read it there. To check
    out another, private ones included, use git/checkout with `workdir`
    your job id: it lands beside them. A `git clone` in bash has no
    credentials.

    Your deliverables are FILES in the working directory — a page as
    index.html, notes as notes/<topic>.md. Revise a file
    in place rather than writing a new one; name files stably. When you are
    done, answer with `text` (short — what changed and why) and `artifacts`
    listing what you produced or revised THIS turn, each with the same `id`
    it had last time. Do not paste a deliverable's content into `text`.

    If you cannot go on without a decision from the person, stop and put
    the question in `ask`; their answer is the next turn's message.
