name: home-pull
# A home box's memory for a strut that keeps a read copy of it (a Mac's,
# after its home moved to the box): the whole memory/export, only when it
# changed since the copy the caller holds. The caller loads it with
# memory/import { replace: true } (home-sync on its side). Seeded only where
# STRUT_HOME_SYNC=1, and open to a person's credential only.
#
# Input:  { hash? (the content_hash of the copy the caller holds) }
# Output: { unchanged: true, content_hash } | memory/export's inline reply ({ data, content_hash, sha256, bytes, counts, manifest })
peer: person
input:
  hash: { type: string, required: false, description: "the content_hash of the memory copy the caller holds" }
steps:
  - id: export
    type: memory/export
    config:
      inline: true
      if_changed: "{{ input.hash }}"
