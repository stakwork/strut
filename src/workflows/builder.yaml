name: builder
# The builder workflow (plans/builder-job.md) — one turn of a WORKFLOW
# BUILD, as a job: the orchestrator's door to authoring (what hive's
# dispatch_strut did by calling the builder chat), launched with `job` on
# the launch like `job` and continued by the same job id. job/dir hands the
# agent the job's directory (no shell: it writes there with the editor — an
# app's files — and git/checkout puts a repository there to read from),
# context/concept puts the `Workflow Builder` page — what THIS workspace
# builds and each kind's convention — at the end of its prompt, the agent
# authors through the meta/* twins (the chat builder's tools as registry
# steps, src/steps/lib/meta/) and answers in the job's reply shape. Seeded
# at boot by createStrut (src/builder-seed.ts); `params.tools`,
# `params.builtins` and `params.system` are the evolvable surface, and a
# host appends its own through `createStrut({ builder })`. Every step here
# is strut's own.
#
# Why a workflow of its own beside `job`: a WORKFLOW lives on one strut —
# that strut's graph, secrets and services — so a build runs on the strut
# it belongs to, here or on a peer (`input.peer`, below); code lives in its
# repository and is checked out wherever a job runs, so a code job runs
# here. The hands differ too: the authoring twins and strut's workflow
# dialect, not a shell and checkouts. A job agent that meets a build runs
# this workflow itself (meta/run-workflow; the `Job` page's docs).
#
# Open to other struts: `peer: true` lets a PEER (plans/federation.md §3)
# launch this workflow as published — no `params` — under `peer/<job>`, as
# the forwarded person. That is no sandbox: authoring is code execution on
# this strut. The agent can publish and run a workflow with an `exec` step,
# write a custom step over `ctx.services.shell`, or run any unsealed
# workflow through meta/run-workflow, `job` included. So this file says: a
# person the org's strut forwards may run code here, as this strut's own
# chat builder always let them (plans/builder-job.md §4), within the org a
# peer token is minted for. A deployment that will not have it drops the
# key, `createStrut({ builder: { peer: false } })`, or puts a person's hand
# on every publish through `approve`. `job` stays closed to peers: its
# input takes `agent` (any ACP command line) and `cwd` (any folder), which
# are a host's to pass.
#
# A build on ANOTHER strut is the same launch with `input.peer`: the one
# step is then strut/run-workflow to that peer's `builder`, under this job
# id, so the job exists here (its record, its runs, the host's row) while
# the work, the files and the thread live there. Resume reattaches (the
# step's `#launch` journal), cancel is forwarded, the nodes the peer's run
# touched fold back tagged with the peer.
peer: true
input:
  prompt: { type: string, description: "What to build, change, test or debug this turn" }
  workspace: { type: string, required: false, description: "The workspace this strut belongs to, by its slug" }
  session: { type: string, required: false, description: "The agent's thread (a session id). Defaults to the job id — one thread across every turn of the build" }
  peer: { type: string, required: false, description: "Build on THAT strut instead (a peer's id, as strut/list-peers gives it): this run launches the peer's `builder` under this job id and waits. Unset on the strut that does the building" }
steps:
  - id: dir
    type: job/dir
  # What THIS workspace builds — the `Workflow Builder` Concept and the
  # kinds under it — rendered for the agent's system prompt, as the chat
  # builder's prompt reads it (src/ai/builder-system.ts) and as `job` reads
  # `Job`. Read before the gate (job.yaml's order); empty without a graph
  # or the page, never a failed run.
  - id: concepts
    type: context/concept
    config:
      name: "{{ params.concept }}"
  # Here, unless the launch names a peer.
  - id: here
    type: if
    config:
      cond: "{{ !input.peer }}"
  - id: build
    type: agent
    depends: here
    when: true
    config:
      cwd: "{{ dir.path }}"
      session: "{{ input.session || $job }}"
      cacheTtl: 1h
      model: "{{ params.model }}"
      maxSteps: "{{ params.maxSteps }}"
      # strut's prompt (with the host's section), then the workspace's page.
      system: |-
        {{ params.system }}
        {{ concepts.text }}
      prompt: "{{ input.workspace ? 'Workspace: @' + input.workspace + ', the one this strut belongs to. ' : '' }}{{ $job ? 'Your job id: ' + $job + '. ' : '' }}{{ input.prompt }}"
      # The web tools (API documentation while authoring) and the EDITOR
      # family — view, create, str_replace, insert on the job's directory,
      # a tree listing, a grep — for an app's files (plans/apps.md §8). No
      # bash: it keeps the agent authoring through its tools. It is no
      # sandbox (the header says why).
      toolFilter: "{{ params.builtins }}"
      agentTools: "{{ params.tools }}"
      approve: "{{ params.approve }}"
      schema:
        type: object
        additionalProperties: false
        required: [text, artifacts]
        properties:
          text: { type: string, description: "Your reply to the person, markdown: what you published (name, version), what the test run showed, what is left." }
          artifacts:
            type: array
            description: "An APP you published, by name and with the version publishing returned — { id, kind: app, title, app: <name>, version: <vN> } — so the person opens what you built where they are (a draft, when a person holds the app at a release). Otherwise usually none: name workflows and runs in `text`. A small inline `content` when it helps (a sample output, a diff), or an earlier job's deliverable by the `url` job/get gave it."
            items:
              type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: { type: string, description: "Stable across turns: the same id next turn means a newer version of the same thing." }
                kind: { type: string, description: "`app` with `app: <name>`. Otherwise only when the link would mislead: markdown | html | image | video | audio | pdf | url | diff | pull_request | code | log | json" }
                title: { type: string }
                label: { type: string, description: "What it is to the reader: Sample output, Diff" }
                summary: { type: string, description: "One sentence about what is in it" }
                path: { type: string, description: "A file a run you started left in the job's directory, relative to it" }
                url: { type: string, description: "An absolute link, or the url job/get gave an earlier job's deliverable" }
                content: { type: string, description: "Small inline content instead of a file" }
                app: { type: string, description: "A published app, by its name (kind: app): its active version, unless `version` names one" }
                version: { type: string, description: "With `app`: the version to show — the one you published (v4); without it, the version people open now" }
          ask:
            type: object
            description: "Only when you need a decision from the person before going on: the question, in prose. The answer comes as the next turn's prompt."
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string }
  # The build happens on the peer (plans/builder-job.md §3): its `builder`,
  # under this job id (kept there as `peer/<job>`), as the forwarded person.
  # The step waits on the peer's event stream, reattaches after a drop or a
  # restart (its `#launch` journal), forwards a cancel, and folds the nodes
  # the peer's run touched onto its own step.end tagged with the peer.
  - id: remote
    type: strut/run-workflow
    depends: here
    when: false
    config:
      peer: "{{ input.peer }}"
      workflow: builder
      input:
        prompt: "{{ input.prompt }}"
        session: "{{ input.session }}"
        workspace: "{{ input.peer }}"
      job: "{{ $job }}"
  # Whichever ran; the other was skipped and reads as undefined (a ternary
  # evaluates both sides, so `?.` and `||`). `peer` says whose the artifacts
  # are.
  - id: result
    type: pack
    depends: [build, remote]
    config:
      text: "{{ build?.object?.text || remote?.output?.text }}"
      artifacts: "{{ build?.object?.artifacts || remote?.output?.artifacts }}"
      ask: "{{ build?.object?.ask || remote?.output?.ask }}"
      cost: "{{ build?.cost || remote?.output?.cost }}"
      session: "{{ build?.session || remote?.output?.session }}"
      peer: "{{ input.peer }}"
params:
  model: claude-sonnet-5-5
  maxSteps: 200
  # The Concept whose page (and the kinds under it) closes the agent's
  # system prompt: `Workflow Builder` (src/concepts/Workflow Builder.md),
  # the page the chat builder's prompt reads too.
  concept: Workflow Builder
  # The built-ins the agent keeps (the agent step's toolFilter): the web
  # tools, for API documentation while authoring, and the editor family
  # for an APP's files in the job's directory (plans/apps.md §8) — view,
  # create, str_replace, insert; a tree listing; a grep. No bash: what the
  # chat builder did with it is meta/run-step with a cassette, meta/get-run
  # and job/read. It keeps the agent authoring; it is no sandbox (the
  # header).
  builtins: [web_search, web_fetch, str_replace_based_edit_tool, repo_overview, fulltext_search]
  # THE evolvable surface: registry steps granted to the agent as tools.
  # `meta/*` is the whole authoring surface as steps — the reads, the runs,
  # publish-workflow, create-step, edit-step, validate-workflow, run-step,
  # the claim steps, verify-run, verify-job — and a twin added later lands
  # here without a seed edit. The graph reads the chat builder has
  # (graph/query is its graph_query: with none, the job wrote custom steps
  # that opened the graph themselves); the job/* reads, to build from an
  # earlier job's deliverables. A host appends its own
  # (`createStrut({ builder: { tools } })`).
  tools:
    - meta/*
    - graph/graph-get
    - graph/graph-search
    - graph/get-ontology
    - graph/query
    - job/list
    - job/get
    - job/read
    # Apps are a builder job's kind of work (plans/apps.md §8): scaffold,
    # build and publish a front-end project over workflows — the editor
    # writes its files in the job's directory.
    - app/*
    # Code to learn from — a UI to port, a client to copy: a repository
    # checked out INTO the job's directory (`workdir` = the job id, which
    # the prompt names), where the editor family reads it. A copy without
    # `workdir` lands in the run's own directory, out of the editor's reach.
    - git/checkout
    # The package STORE (plans/marketplace.md §7, §8): searched before
    # writing an integration, a hit's page read (what it holds and
    # reaches), the Concept tree browsed; a person installs one.
    - package/search
    - package/get
    - package/concepts
  # Tools among the grants that need the PERSON's approval
  # (plans/proposals.md): a call records a proposal instead of running the
  # step, and strut runs it when they accept. None by default; a deployment
  # that wants a hand on every publish names meta/publish-workflow,
  # meta/create-step and meta/edit-step here through its delta.
  approve: []
  # The agent's system prompt. What is the JOB's — who the agent is,
  # claims, the kinds, the reply — is written here, around ONE line the
  # seed replaces with strut's rules for building (src/builder-seed.ts):
  # the workflow dialect, the tools and the procedure in the meta/* names,
  # rendered from src/ai/prompts.ts, the one source the builder chat's
  # prompt is rendered from too (plans/builder-job.md §1). A host's section
  # is appended after it (`createStrut({ builder: { system } })`).
  system: |
    You are a workflow BUILDER working on a job with a person, over many
    turns: you author, revise, test and debug this strut's workflows and
    custom steps, and the APPS over them. Each turn you get one message;
    you remember the turns before it. You have no shell: a workflow or a
    step is published through your tools, an app is a directory you write
    with the editor in the job's directory, and everything you learn comes
    back as a tool result. To learn from code in a repository, check it out
    with git/checkout, `workdir` your job id: it lands in your directory,
    where the editor reads it.

    <<strut: the builder's rules>>

    Before you answer, state what the workflow should do as a claim —
    meta/add-claim with subject { kind: workflow, name } — with a check
    that runs it as its user would, and meta/verify-run on the test run.
    Refuted is not done: fix the workflow (or a wrong check,
    meta/edit-check), verify again, and only then answer. An app the same
    way: app/look at its directory (`path`), fix what it shows and look
    again, and app/publish once it shows what was asked — each publish is
    a version (or a draft) a person sees, so never one per attempt.

    The kinds of thing this workspace builds are listed at the end of this
    prompt, from its knowledge graph: each a page with that kind's
    convention. Before building, match the ask against them; when it is
    one of these kinds, open the page and follow it — the workflow it
    names, the shape it expects — and say in `text` which page you
    followed. No list there: go on without it.

    Answer with `text`: what you published (name, version), what the test
    run showed, and what is left. An app you published is a deliverable:
    list it in `artifacts` as `{ id, kind: "app", title, app: "<name>",
    version: "<the version publishing returned>" }` (the same id each turn
    you change it), so the person opens what you built where they are. Otherwise `artifacts` stays empty: name workflows and runs in
    `text`; a small inline `content` (a sample output) when it helps. If
    you cannot go on without the person's decision, stop and put the
    question in `ask`; their answer is the next turn's message.
