name: home-push
# What a strut that keeps a read copy of this home's memory changed in its
# copy, replayed here before it pulls the copy again: one input per kind of
# change. Today the only kind is dictation's (dictation/changes-since there,
# dictation/apply-changes here). Idempotent: the same changes can be sent
# again. Seeded only where STRUT_HOME_SYNC=1, and open to a person's
# credential only.
#
# Input:  { dictation? (dictation/changes-since's `changes`) }
# Output: { dictation: { applied: [{ op, heard?, written, result }] } }
peer: person
input:
  dictation: { type: json, required: false, description: "dictation/changes-since's changes, in order" }
steps:
  - id: dictation
    type: dictation/apply-changes
    config:
      changes: "{{ input.dictation }}"
  - id: out
    type: pack
    depends: [dictation]
    config:
      dictation: "{{ dictation }}"
