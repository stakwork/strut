name: tidy-memory
description: Finds people and places saved more than once and merges them.
# The tidy-memory janitor on the workspace graph, shipped in place of
# workflow.yaml when the host's memory is the graph (`memory: "graph"`,
# src/system-workflows.ts): the same workflow and automation. No built-in
# tools and no write but graph/merge, which it can only use on a pair
# graph/duplicates offers. Stamped "janitor", graph/merge refuses to merge the
# user away, into the user only on their full name, and stops at 10 merges a
# day (src/graph/merge.ts). Every merge can be undone with graph/unmerge.
steps:
  - id: tidy
    type: agent
    config:
      cwd: "."
      toolFilter: [none]
      agentTools: [graph/duplicates, graph/graph-get, graph/graph-neighbors, graph/merge]
      maxSteps: 60
      system: You tidy a person's long-term memory. You merge two nodes only when you are sure they are the same person or thing.
      prompt: |
        Tidy the user's memory. Call graph_duplicates. For each pair, call
        graph_graph_get and graph_graph_neighbors on both, to see what is
        known about each. Only those pairs can be merged: graph_merge refuses
        any other. Merge with graph_merge only
        when you are sure they are the same person or thing: the names fit (a
        nickname or a full name), nothing conflicts (different surnames,
        employers, cities, or relationships to the user), and something links
        them (the same relationship to the user, a shared fact beyond where
        they live or work, or a person with the user's full name). A shared
        first name alone is not a link, and neither is a shared city, address
        or employer alone: relatives share them. Keep the node with more
        edges, and always keep the user (the node marked is_owner): merge the
        other one into the user, never the other way. Merge at most 10 pairs;
        when graph_merge says the day's limit is reached, stop. Finish with
        one line per merge ("Kate into Katie Moss: same sister, same city"),
        then one line naming the pairs you left alone. If nothing was merged,
        say "Nothing to merge".
  # The run's output: the agent's final answer and what it cost.
  - id: result
    type: pack
    config:
      text: "{{ tidy.result }}"
      cost: "{{ tidy.cost }}"
