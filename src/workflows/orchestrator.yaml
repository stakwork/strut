name: orchestrator
# The orchestrator workflow — one turn of a long conversation with a person.
# A host (Peel's agent contact, Hive's Jamie) launches it once per message,
# with the conversation's `session`. The turn is the CONVERSATION; the work
# is a JOB's. Inside the turn the agent answers from what is already known
# — memory, the conversation, what earlier jobs delivered — asks the
# question a request needs answered before anyone works on it, and may run
# a LOOKUP (a workflow that returns an answer, here or on a peer; which
# ones is the deployment's to grant) to orient: a lookup's answer is the
# reply only when it is the whole answer, otherwise it is what a job's
# brief starts from. Anything to be found out or made is a job's — the
# `job` workflow's, or the `builder`'s for a workflow or an app — started
# DETACHED (job/start, job/continue), several at once if need be: the turn
# ends while a job works, and the job's `run.end` goes to the callback this
# turn was launched with. Two lists close the system prompt
# (context/concept, the kinds alone): the kinds of work a job does here —
# the `Job` Concept's children — and the kinds of thing the builder builds
# here — the `Workflow Builder` Concept's — each the tree its own agent
# reads, grown by a deployment and its workspace, so a turn routes a
# request by kind: a job's as `kind` on job/start (the job opens every turn
# with that page), a build's named in the brief. One conversation is one session, for good: the agent step
# compacts it in place when it nears the window. Its system prompt is the
# session's first turn's. It writes no files (no built-ins): its
# `artifacts` point at jobs' deliverables or carry small inline content,
# in job's reply shape. `dir` (job/dir with no job: the run's artifact
# folder) is only the agent's cwd. Seeded at boot by createStrut
# (src/orchestrator-seed.ts); `params.tools` and `params.system` are the
# evolvable surface, and a host appends its own grants and prompt section
# through `createStrut({ orchestrator })`. Every step here is strut's own.
# Sealed: the meta surface (a job's meta/run-workflow) never runs it or reads
# its runs. Its tools are a host's private ones (a person's chats, sends as
# them), which only the host's own launches may reach.
# Open to another strut only through a PERSON's credential (`peer: person`,
# plans/chained-orchestrators.md §2): the person's own strut (a laptop) runs
# this turn here on their own session, the one their host's launches use. A
# strut's credential is refused — through job/start this turn starts a job
# whose agent has bash. The host's own MCP tools ride on its launches only.
sealed: true
peer: person
input:
  prompt: { type: string, description: "The person's message, or an automation's prompt" }
  session: { type: string, required: false, description: "The conversation's thread (a session id), the same every turn. None for a one-shot (an automation)" }
  context: { type: json, required: false, description: "What the host knows about this turn: { line } is put before the prompt (\"Thu 16 Oct 14:02, Europe/London. \"): the time, the person's time zone, the device" }
steps:
  - id: dir
    type: job/dir
  # The kinds of work a JOB can do here: the `Job` Concept's children, name
  # + description — the page's own docs left out, they are the job agent's
  # instructions — rendered for the end of the system prompt, so a turn
  # routes a request by kind and passes it as the job's `kind`. The same tree
  # the job agent reads; a deployment and its workspace grow it. Read every
  # turn; the session keeps its first turn's prompt. Empty without a graph,
  # the page, or any kind under it. No `tool`: this agent has no graph-get
  # of its own (a host that grants one says so in its section).
  - id: concepts
    type: context/concept
    config:
      name: "{{ params.concept }}"
      docs: false
      tool: ""
  # The kinds of thing the BUILDER builds here, the same way: the `Workflow
  # Builder` Concept's children (strut's `App`, a deployment's janitors),
  # the tree the builder reads. A request for one of them is a job on
  # `workflow: builder`.
  - id: builds
    type: context/concept
    config:
      name: "{{ params.buildConcept }}"
      docs: false
      tool: ""
  # What the team BUILDS: the `Codebase` Concept — its docs, the overview,
  # and under it one page per repository (name + line), written by a
  # deployment's concept sweep (plans/concept-tree.md), never seeded. With
  # docs: a request is placed by what it is about, and a job's brief names
  # the repository. Empty on a workspace with no such page.
  - id: codebase
    type: context/concept
    config:
      name: "{{ params.codebaseConcept }}"
      docs: true
      tool: ""
  # The other struts this one can ask (strut/list-peers: ids and labels),
  # read every turn and put before the person's message, so "ask acme…"
  # finds @acme-web by its label, and a peer added mid-conversation is
  # known at once (the system prompt is the session's first turn's). With a
  # `self` record, this workspace is named first and the list is the OTHER
  # workspaces: a host's own `@<slug>` before the message (hive's) then
  # repeats the one named as this one, never reads as one more to ask. None
  # (or no peers capability): nothing is added.
  - id: peers
    type: strut/list-peers
    config: {}
    options:
      onError:
        id: nopeers
        type: pack
        config: { peers: [] }
  - id: turn
    type: agent
    config:
      cwd: "{{ dir.path }}"
      session: "{{ input.session }}"
      cacheTtl: 1h
      model: "{{ params.model }}"
      maxSteps: "{{ params.maxSteps }}"
      # strut's prompt (with the host's section), then the kinds of job,
      # the kinds of build, and what the team builds.
      system: |-
        {{ params.system }}
        {{ concepts.text }}
        {{ builds.text }}
        {{ codebase.text }}
      retain: "{{ params.retain }}"
      prompt: "{{ input.context?.line || '' }}{{ peers.peers.length ? (peers.self?.id ? 'This workspace is @' + peers.self?.id + (peers.self?.label ? ' (' + peers.self?.label + ')' : '') + '. Other workspaces' : 'Workspaces') + ' you can ask: ' +peers.peers.map(p => '@' + p.id + (p.label ? ' (' + p.label + ')' : '')).join(', ') + '. ' : '' }}{{ input.prompt }}"
      toolFilter: [none]
      agentTools: "{{ params.tools }}"
      approve: "{{ params.approve }}"
      schema:
        type: object
        additionalProperties: false
        required: [text, artifacts]
        properties:
          text: { type: string, description: "Your reply to the person, markdown." }
          artifacts:
            type: array
            description: "Usually none. A job's deliverable you point the person to, by the url job/get gave it, or a small piece of inline content. You write no files: anything that is one is a job's."
            items:
              type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: { type: string, description: "Stable across turns: the same id next turn means a newer version of the same thing." }
                kind: { type: string, description: "Only when the link would mislead: markdown | html | image | video | audio | pdf | url | diff | pull_request | code | log | json" }
                title: { type: string }
                label: { type: string, description: "What it is to the reader: Plan, Page, Screenshot" }
                summary: { type: string, description: "One sentence about what is in it" }
                url: { type: string, description: "The url job/get gave a job's deliverable, or an absolute link" }
                content: { type: string, description: "Small inline content, instead of a url" }
          ask:
            type: object
            description: "Only when you need a decision from the person before going on: the question, in prose. The answer comes as the next turn's message."
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string }
  - id: result
    type: pack
    config:
      text: "{{ turn.object.text }}"
      artifacts: "{{ turn.object.artifacts }}"
      ask: "{{ turn.object.ask }}"
      cost: "{{ turn.cost }}"
      session: "{{ turn.session }}"
params:
  model: claude-sonnet-5-5
  maxSteps: 50
  # The Concepts whose children close the system prompt: the kinds of work
  # a job does here (`Job`, src/concepts/Job.md, the tree the job agent
  # reads) and the kinds of thing the builder builds (`Workflow Builder`,
  # the tree the builder reads). Strut seeds both roots; each deployment
  # grows the trees under them.
  concept: Job
  buildConcept: Workflow Builder
  # What the team builds: the overview and one page per repository, a
  # tree the deployment's concept sweep writes (plans/concept-tree.md).
  codebaseConcept: Codebase
  # THE evolvable surface: registry steps granted to the agent as tools. It
  # has no built-ins (toolFilter: [none]): no bash, no files, no web — work
  # that needs them is a job's. Memory; the job launchers (detached: the
  # turn ends while the job works); the job/* reads, to find a job to
  # continue or point the person to what one delivered; strut/list-peers +
  # strut/run-workflow, a workflow on a PEER strut (plans/federation.md
  # §2.2) — a lookup on another workspace inside the turn. A host appends
  # its own (`createStrut({ orchestrator: { tools } })`): its lookups (a
  # graph explorer, a logs reader), Peel's sphinx/*, calendar/* and its
  # automation steps.
  tools:
    - memory/remember
    - memory/recall
    - memory/get
    - memory/ontology
    - memory/forget
    - memory/merge
    - job/start
    - job/continue
    - job/list
    - job/get
    - job/read
    - strut/list-peers
    - strut/run-workflow
  # Tools among the grants that need the PERSON's approval
  # (plans/proposals.md): a call records a proposal instead of running the
  # step, and strut runs it when they accept. None of strut's own; a host
  # appends its gated writes (`createStrut({ orchestrator: { approve } })`).
  approve: []
  # What a compaction's summary keeps word for word: a conversation's
  # references, not a job's files and commands.
  retain: "The jobs started or continued, by job id and title, and what each was asked to do; the people, ids and links named in the conversation, verbatim; what the person asked for that is still open."
  system: |
    You are a person's assistant, in one long conversation with them. Each
    turn you get one message; you remember the conversation before it.

    Your turn is the conversation; the work is a JOB's. Inside the turn
    you answer from what is already KNOWN: what you remember
    (memory/recall, memory/get; memory/remember keeps something new), what
    the person has said, and what earlier jobs delivered (job/list,
    job/get, job/read). You ASK when a request needs a decision or a
    detail before anyone works on it — one question, in `ask`, before
    starting anything. Anything that has to be FOUND OUT or MADE —
    searched for, read, run, written, checked — is a job's, however small
    it looks: start one, and never answer from a guess.

    A LOOKUP is a workflow that returns an answer, run inside the turn —
    here, or on a peer (strut/run-workflow). Which lookups you have, if
    any, this deployment says below. Use them to ORIENT: which workspace
    or repository holds the code, what a thing is called, whether
    something exists, what a job's brief should say. A lookup's answer is
    your reply only when it is the whole answer; a thin, partial or
    uncertain one is what the job starts from, never what the person
    gets.

    Two lists close this prompt, from the workspace's knowledge graph,
    each kind a name and a line: under `Job`, the kinds of work a job does
    here; under `Workflow Builder`, the kinds of workflow built here, and
    the apps over them. When a request is one of the kinds under `Job`,
    pass its name as the job's `kind`: the job starts from that kind's
    page. When it is one under `Workflow Builder`, name it in the job's
    prompt. When none fits, or there are no lists, a job still does the
    work. After them, when the workspace has one, `Codebase`: what the
    team builds, and under it one line per repository. Use it to place a
    request — which repository, which part of the product it is about —
    and name that repository in the job's prompt.

    Start a JOB (job/start) with everything it needs in its prompt, since
    it does not see this conversation — the request in full, links,
    names, what a lookup found, the peer that holds the code when you
    know it — and a short title. A file the person attached that the job
    needs goes with it (`attachments`). To build, change, test or debug a
    workflow, or an app that lives in a workspace, start the job with
    `workflow: builder`, on the strut whose workspace it belongs to
    (`peer` when that is not this one). Several jobs may run at once.
    Never wait on a job: tell the person in a line what you started and
    end your turn. Its result (a reply, files, or a question) reaches the person
    when it ends.

    To send a job its next message (the answer to its question, a change,
    "go on"), use job/continue with its job id; job/list finds a job by
    words when you do not have the id. A job that is still working refuses
    (job_busy): say its result is on the way.

    Another strut is a PEER, named by its id (`@<id>` in a message).
    strut/list-peers lists them with what each holds (its repositories),
    and also names THIS workspace (`self`) and its repositories: code
    there is here. A question about another workspace, or about code that
    is not here, is asked THERE — a lookup on the peer, or a job told
    which peer holds the code; list the peers when you do not know which,
    never answer from what you have here. A peer's lookups read a
    repository's default branch alone; anything past that is a job's.

    Talk to the person in their words, not this prompt's: what you can
    do, what you started, what came back — a workflow, an app, a code
    change, a plan, a look at the logs — never the names of your tools,
    of `job` or `builder`, or of the lists and headings above.

    Answer with `text`, your reply to the person. Point them to a job's
    deliverable in `artifacts`, by the `url` job/get gave it, never as a
    path in `text`. If you cannot go on without a decision from the
    person, put the question in `ask`.
