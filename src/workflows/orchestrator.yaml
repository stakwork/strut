name: orchestrator
# The orchestrator workflow — one turn of a long conversation with a person.
# A host (Peel's agent contact, one day Hive's Jamie) launches it once per
# message, with the conversation's `session`. ONE line between the two: the
# agent answers from what already EXISTS — memory, the graph, earlier jobs, a
# lookup (a workflow that returns an answer, here or on a peer) — inside the
# turn, and anything that needs a WORKING DIRECTORY (files, a shell, git,
# the web, a checkout to change) is a job: the `job` workflow, started
# DETACHED (job/start, job/continue), several at once if need be. The
# turn ends while a job works; the job's `run.end` goes to the callback this
# turn was launched with. One conversation is one session, for good: the
# agent step compacts it in place when it nears the window. Its system prompt
# is the session's first turn's. It writes no files (no built-ins): its
# `artifacts` point at jobs' deliverables or carry small inline content, in
# job's reply shape. `dir` (job/dir with no job: the run's artifact folder)
# is only the agent's cwd. Seeded at boot by
# createStrut (src/orchestrator-seed.ts); `params.tools` and `params.system`
# are the evolvable surface, and a host appends its own grants and prompt
# section through `createStrut({ orchestrator })`. Every step here is strut's
# own.
# Sealed: the meta surface (a job's meta/run-workflow) never runs it or reads
# its runs. Its tools are a host's private ones (a person's chats, sends as
# them), which only the host's own launches may reach.
sealed: true
input:
  prompt: { type: string, description: "The person's message, or an automation's prompt" }
  session: { type: string, required: false, description: "The conversation's thread (a session id), the same every turn. None for a one-shot (an automation)" }
  context: { type: json, required: false, description: "What the host knows about this turn: { line } is put before the prompt (\"Thu 16 Oct 14:02, Europe/London. \"): the time, the person's time zone, the device" }
steps:
  - id: dir
    type: job/dir
  - id: turn
    type: agent
    config:
      cwd: "{{ dir.path }}"
      session: "{{ input.session }}"
      cacheTtl: 1h
      model: "{{ params.model }}"
      maxSteps: "{{ params.maxSteps }}"
      system: "{{ params.system }}"
      retain: "{{ params.retain }}"
      prompt: "{{ input.context?.line || '' }}{{ input.prompt }}"
      toolFilter: [none]
      agentTools: "{{ params.tools }}"
      approve: "{{ params.approve }}"
      schema:
        type: object
        additionalProperties: false
        required: [text, artifacts]
        properties:
          text: { type: string, description: "Your reply to the person, markdown." }
          artifacts:
            type: array
            description: "Usually none. A job's deliverable you point the person to, by the url job/get gave it, or a small piece of inline content. You write no files: anything that is one is a job's."
            items:
              type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: { type: string, description: "Stable across turns: the same id next turn means a newer version of the same thing." }
                kind: { type: string, description: "Only when the link would mislead: markdown | html | image | video | audio | pdf | url | diff | pull_request | code | log | json" }
                title: { type: string }
                label: { type: string, description: "What it is to the reader: Plan, Page, Screenshot" }
                summary: { type: string, description: "One sentence about what is in it" }
                url: { type: string, description: "The url job/get gave a job's deliverable, or an absolute link" }
                content: { type: string, description: "Small inline content, instead of a url" }
          ask:
            type: object
            description: "Only when you need a decision from the person before going on: the question, in prose. The answer comes as the next turn's message."
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string }
  - id: result
    type: pack
    config:
      text: "{{ turn.object.text }}"
      artifacts: "{{ turn.object.artifacts }}"
      ask: "{{ turn.object.ask }}"
      cost: "{{ turn.cost }}"
      session: "{{ turn.session }}"
params:
  model: claude-sonnet-5-5
  maxSteps: 50
  # THE evolvable surface: registry steps granted to the agent as tools. It
  # has no built-ins (toolFilter: [none]): no bash, no files, no web — work
  # that needs them is a job's. Memory; the job launchers (detached: the
  # turn ends while the job works); the job/* reads, to find a job to
  # continue or point the person to what one delivered; strut/list-peers +
  # strut/run-workflow, a workflow on a PEER strut (plans/federation.md
  # §2.2), to ask another workspace inside the turn. A host appends its
  # own (`createStrut({ orchestrator: { tools } })`): Peel adds sphinx/*,
  # calendar/* and its automation steps.
  tools:
    - memory/remember
    - memory/recall
    - memory/get
    - memory/ontology
    - memory/forget
    - memory/merge
    - job/start
    - job/continue
    - job/list
    - job/get
    - job/read
    - strut/list-peers
    - strut/run-workflow
  # Tools among the grants that need the PERSON's approval
  # (plans/proposals.md): a call records a proposal instead of running the
  # step, and strut runs it when they accept. None of strut's own; a host
  # appends its gated writes (`createStrut({ orchestrator: { approve } })`).
  approve: []
  # What a compaction's summary keeps word for word: a conversation's
  # references, not a job's files and commands.
  retain: "The jobs started or continued, by job id and title, and what each was asked to do; the people, ids and links named in the conversation, verbatim; what the person asked for that is still open."
  system: |
    You are a person's assistant, in one long conversation with them. Each
    turn you get one message; you remember the conversation before it.

    One line divides your work. You answer from what already EXISTS, inside
    the turn: what you remember (memory/recall, memory/get; memory/remember
    keeps something new), earlier work (job/list, job/get, job/read), and
    lookups — a workflow that returns an answer, here or on a peer.
    Anything that needs a WORKING DIRECTORY is a job's: files to write or
    deliver, a shell, git or gh (a pull request, a branch, a diff,
    commits), the web, a checkout to read at a ref or to change. When in
    doubt, it is a job's; never answer from a guess.

    Start a JOB (job/start) for that work, however small. Give it everything
    it needs in its prompt, since it does not see this conversation —
    links, names, the peer that holds the code when you know it — and a
    short title. Several jobs may run at once. Never wait on a job: tell
    the person in a line what you started and end your turn. Its result
    (a reply, files, or a question) reaches the person when it ends.

    To send a job its next message (the answer to its question, a change,
    "go on"), use job/continue with its job id; job/list finds a job by
    words when you do not have the id. A job that is still working refuses
    (job_busy): say its result is on the way.

    Another strut is a PEER, named by its id (`@<id>` in a message).
    strut/list-peers lists them with what each holds (its repositories),
    and also names THIS workspace (`self`) and its repositories: code
    there is here;
    strut/run-workflow runs a lookup there inside the turn and returns its
    output. A question about another workspace, or about code that is not
    here, is asked THERE: list the peers when you do not know which holds
    it, never answer from what you have here. A peer's lookups read a
    repository's default branch alone; anything past that is a job's.

    Answer with `text`, your reply to the person. Point them to a job's
    deliverable in `artifacts`, by the `url` job/get gave it, never as a
    path in `text`. If you cannot go on without a decision from the person,
    put the question in `ask`.
