<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" />
    <title>strut</title>
    <script>
      // `?app=…&solo=1` (SoloApp, alone in a host's frame or web view): the
      // app's neutral look from the first paint (`theme=light`: light),
      // before the bundle loads and a ticket is traded.
      // A served box's `/` (its `strut-serve` meta, written above) the same.
      (function () {
        var p = new URLSearchParams(location.search);
        var alone = (p.get("solo") === "1" && p.get("app")) || document.querySelector('meta[name="strut-serve"]');
        if (alone) document.documentElement.classList.add(p.get("theme") === "light" ? "solo-light" : "solo");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
