# The standalone strut server on the graph backend: strut + its own Neo4j +
# a browser. Workflows/steps live in Neo4j; runs, chats, secrets, artifacts
# stay under /data/workspace (see src/graph/wiring.ts).
#
#   docker compose up -d             # then open http://localhost:3000
#
# Nothing is built: strut is the published image, ghcr.io/stakwork/strut,
# pushed from main on every merge (`latest`, and the short commit sha — pin
# one with STRUT_IMAGE_TAG=<sha>; `docker compose pull` fetches a newer
# latest). To run THIS checkout's code instead (working on strut itself):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Neo4j Browser: http://localhost:7475 — connect to bolt://localhost:7689,
# neo4j / testtest. Host ports are offset so they don't collide with a local
# Neo4j on 7474/7687 or the test:graph throwaway on 7688.
#
# Provider keys: put ANTHROPIC_API_KEY=… (or OPENAI_API_KEY, GOOGLE_API_KEY,
# OPENROUTER_API_KEY, XAI_API_KEY) in ./.env, or paste them under Secrets in
# the UI once it's up. See AGENTS.md "Environment" for every variable.
#
# Filesystem backend instead (no Neo4j; `docker compose up -d browser` first
# for the browser steps):
#   docker compose run --rm --no-deps --service-ports -e STRUT_WORKSPACE_BACKEND=fs strut
#
# Browser: the browser/* steps (and browser-capture, browser-explore,
# browser-watch) drive the `browser` service, a Playwright server
# (images/browser, published as ghcr.io/stakwork/strut-browser). It sits on a
# network of its own that strut joins, so a page can reach strut but not
# Neo4j; what that container can reach, a page can reach. Its tag must stay on
# strut's playwright-core major.minor (package.json): the server refuses any
# other. BROWSER_WS_PATH is its one door — set your own in ./.env.
services:
  neo4j:
    # Stock community image: the graph backend needs fulltext + vector indexes
    # (5.13+), no APOC/GDS. Same image test:graph runs against.
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "${STRUT_NEO4J_HTTP_PORT:-7475}:7474"
      - "${STRUT_NEO4J_BOLT_PORT:-7689}:7687"
    environment:
      NEO4J_AUTH: neo4j/testtest   # strut's own default credentials (bolt.ts)
      # Neo4j Browser prefills its connect form from the advertised address,
      # which defaults to the container port (7687) — on the host that's some
      # other Neo4j, or nothing. Advertise the mapped host port instead.
      NEO4J_server_bolt_advertised__address: "localhost:${STRUT_NEO4J_BOLT_PORT:-7689}"
    volumes:
      - strut-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testtest 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  browser:
    image: ghcr.io/stakwork/strut-browser:1.63.0   # or `build: images/browser`
    restart: unless-stopped
    environment:
      BROWSER_WS_PATH: "${BROWSER_WS_PATH:-strut-browser}"
    networks:
      - browser

  strut:
    # Published by .github/workflows/publish-image.yml (amd64 + arm64).
    image: ghcr.io/stakwork/strut:${STRUT_IMAGE_TAG:-latest}
    # Back up after a crash, and after a host reboot — where Docker starts the
    # containers itself and ignores depends_on, so strut may come up before
    # Neo4j answers, fail its boot, and retry until it does. Runs cut off are
    # resumed at boot (STRUT_AUTO_RESUME). `docker compose stop` keeps it down.
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy   # bolt.verify() fails the boot when nothing is listening
      browser:
        condition: service_started   # connected on a browser step's first page, not at boot
    networks:
      - default
      - browser
    ports:
      - "${STRUT_HOST_PORT:-3000}:3000"   # STRUT_HOST_PORT=3100 docker compose up — when `npm run dev` already has 3000
    env_file:
      - path: .env
        required: false
    # `environment` wins over env_file, so a ./.env written for `npm run dev`
    # (STRUT_WORKSPACE_BACKEND=fs, NEO4J_* at localhost) can't misroute this.
    environment:
      STRUT_WORKSPACE_BACKEND: graph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testtest
      # No jarvis here: seed its ontology so jarvis-typed nodes (Document,
      # Concept, EvalSet, …) have their schemas. Add-only.
      STRUT_GRAPH_SEED_ONTOLOGY: "1"
      STRUT_WORKSPACE: /data/workspace
      STRUT_MODEL_DIR: /data/models
      # The browser/* steps' Playwright server (the `browser` service above).
      BROWSER_WS_URL: ws://browser:3000
      BROWSER_WS_PATH: "${BROWSER_WS_PATH:-strut-browser}"
      # STRUT_API_KEY: change-me     # shared secret for the API — unset, EVERY endpoint is open; set before exposing the port
      # STRUT_SECRET_KEY: …          # encrypts the secret store; see AGENTS.md "Secrets"
    volumes:
      - strut-workspace:/data/workspace   # runs, artifacts, chats, secrets, materialized custom steps
      - strut-models:/data/models         # MiniLM (~90MB, fetched on first boot) + STT models
      - strut-uv-cache:/root/.cache/uv    # PEP 723 script environments survive restarts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      # First boot seeds the schema + ontology and downloads MiniLM before listening.
      start_period: 120s

networks:
  browser:

volumes:
  strut-neo4j:
  strut-workspace:
  strut-models:
  strut-uv-cache:
