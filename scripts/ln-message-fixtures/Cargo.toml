[package]
name = "ln-message-fixtures"
version = "0.0.0"
edition = "2021"
publish = false

# Sphinx's core at the rev sphinx-rs's FFI pins (sphinx-ffi/Cargo.toml at
# stakwork/sphinx-rs fc98ae6, what Peel's `Sphinxrs.signBytes` is built
# from): the vectors are its signer's output, never a reimplementation's.
# The FFI crate itself builds only a staticlib and a cdylib, so nothing can
# depend on it; src/main.rs calls what `sign_bytes` calls.
[dependencies]
sphinx = { git = "https://github.com/stakwork/sphinx", rev = "0fb78cea33cdb6a7a0c176667a78ef3ea2ead9ed" }
hex = "0.4"
serde_json = "1"

[workspace]
